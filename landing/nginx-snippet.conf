# Tastoria landing (/gioi-thieu/) and APK download (/tai-ve/), for the `server` block of deploy/nginx/tastoria.conf,
# placed before `location /` (the app starts at `/bep`).
#
# Expected files inside the nginx container:
#   /usr/share/nginx/landing/   landing/index.html, style.css, fonts/, img/   (baked in web.Dockerfile)
#   /srv/tastoria/dist/         repo dist/ mounted read-only (APK files)
#
# add_header inside a location drops the server-level ones, so each location repeats them (same as tastoria.conf).

location = / {
    alias /usr/share/nginx/landing/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}

location = /gioi-thieu {
    # relative Location: behind Cloudflare (TLS ends there) an absolute one would say http:// and this port
    absolute_redirect off;
    return 301 /gioi-thieu/;
}

location ^~ /gioi-thieu/ {
    alias /usr/share/nginx/landing/;

    # Fonts and screenshots: names are not content-hashed, so one week, not immutable.
    location ~ ^/gioi-thieu/((?:fonts|img)/[A-Za-z0-9._-]+)$ {
        alias /usr/share/nginx/landing/$1;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /gioi-thieu/style.css {
        alias /usr/share/nginx/landing/style.css;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /gioi-thieu/story.js {
        alias /usr/share/nginx/landing/story.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /gioi-thieu/ {
        rewrite ^ /gioi-thieu/index.html last;
    }

    location = /gioi-thieu/index.html {
        internal;
        alias /usr/share/nginx/landing/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # anything else under /gioi-thieu/ (docs/, this snippet, unknown paths) is not published
    return 404;
}

# Only APK files are served from dist/ (dist/ also holds tastoria-vp-kit.zip, which stays private).
location ~ ^/tai-ve/(tastoria-[0-9][0-9A-Za-z.-]*\.apk)$ {
    alias /srv/tastoria/dist/$1;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="$1"' always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
}

# plain prefix (no ^~), so the regex above is tried first
location /tai-ve/ {
    return 404;
}
