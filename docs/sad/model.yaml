# Module của modular monolith. deps = các module được phép gọi (qua service.py). Không vòng.
modules:
  - {id: M01, name: core, desc: "DB session, Unit of Work, lỗi RFC 9457, Idempotency-Key, cấu hình, lưu tệp, bảo mật dùng chung", deps: []}
  - {id: M02, name: identity, desc: "Tài khoản, mật khẩu, JWT, refresh token, đặt lại mật khẩu, khoá đăng nhập", deps: [core]}
  - {id: M03, name: privacy, desc: "Mục đích đồng ý, phiên bản điều khoản, nhật ký đồng ý, yêu cầu chủ thể dữ liệu, nhật ký kiểm toán", deps: [core, identity]}
  - {id: M04, name: catalog, desc: "Thành phần thực phẩm, nguyên liệu, món, bước, dinh dưỡng món, lớp thị giác, dữ liệu tham chiếu", deps: [core]}
  - {id: M05, name: profile, desc: "Hồ sơ (cột sức khỏe mã hoá), dị ứng, chế độ ăn, món hay ăn, cài đặt; công thức BMR/TEE/E_mâm; get_meal_constraints()", deps: [core, identity, privacy, catalog]}
  - {id: M06, name: pantry, desc: "Lô, giao dịch kho, quy đổi lượng, độ gấp u (tính lúc đọc)", deps: [core, catalog]}
  - {id: M07, name: mlops, desc: "Phiên bản mô hình, bản đồ lớp, con trỏ triển khai, nạp mô hình", deps: [core, catalog]}
  - {id: M08, name: scan, desc: "Nhận ảnh, job suy luận (worker), chip, xác nhận vào kho", deps: [core, catalog, pantry, mlops, privacy]}
  - {id: M09, name: events, desc: "Ghi tương tác có cổng đồng ý, chống trùng theo event_id", deps: [core, privacy]}
  - {id: M10, name: substitute, desc: "Cặp thay thế, embedding nguyên liệu, gợi ý thay thế có lọc cứng, danh sách đi chợ", deps: [core, catalog, profile, pantry, mlops]}
  - {id: M11, name: meal, desc: "Lọc cứng, xếp hạng gu, ghép mâm, đổi món, nhận thay thế, dòng lý do", deps: [core, catalog, profile, pantry, substitute, events, mlops, privacy]}
  - {id: M12, name: cooking, desc: "Lịch nấu CP-SAT, phiên nấu, nấu xong (UoW), hoàn tác", deps: [core, catalog, meal, pantry, events]}
  - {id: M13, name: journal, desc: "Nhật ký tuần (view chỉ đọc)", deps: [core, cooking, meal, pantry, profile]}
  - {id: M14, name: survey, desc: "Phiếu khảo sát khối không đầy đủ, người tham gia ẩn danh, điểm, món hay ăn", deps: [core, catalog, privacy]}
  - {id: M15, name: admin, desc: "Endpoint/CLI nhân sự: yêu cầu dữ liệu, kiểm toán, nhập kho món, mô hình, khảo sát", deps: [core, identity, privacy, catalog, mlops, survey, substitute]}
  - {id: M16, name: jobs, desc: "Tác vụ định kỳ: xoá ảnh, sao lưu, sweeper, dọn hết hạn", deps: [core, scan, identity, privacy]}

# Kiểu: uuid, text, citext, int, smallint, bigint, numeric, real, bool, date, timestamptz, bytea, jsonb, vector(n), enum(...)
# Ký hiệu: PK, FK->bảng(cột), UQ, NN (not null), CK(...) check, D=default. Bảng không có user_id thì truy chủ sở hữu qua FK.
tables:
  # ---------- core
  - name: idempotency_keys
    module: core
    columns: ["user_id uuid NN FK->users(id) ON DELETE CASCADE", "key text NN", "request_sha256 bytea NN", "status_code smallint NN", "response_body jsonb NN", "created_at timestamptz NN D now()"]
    pk: [user_id, key]
    notes: "jsonb chỉ lưu phản hồi để trả lại nguyên văn, không truy vấn; xoá sau 48 giờ (UC34)"
  # ---------- identity
  - name: users
    module: identity
    columns: ["id uuid PK", "email citext NN UQ", "password_hash text NN", "role enum(user,admin,curator,ml_operator) NN D user", "status enum(active,deletion_requested) NN D active", "token_version int NN D 0", "failed_logins smallint NN D 0", "locked_until timestamptz NULL", "created_at timestamptz NN", "updated_at timestamptz NN"]
    pk: [id]
  - name: refresh_tokens
    module: identity
    columns: ["id uuid PK", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "family_id uuid NN", "token_sha256 bytea NN UQ", "issued_at timestamptz NN", "expires_at timestamptz NN", "revoked_at timestamptz NULL", "replaced_by_id uuid NULL FK->refresh_tokens(id)", "user_agent text NULL"]
    pk: [id]
  - name: password_resets
    module: identity
    columns: ["id uuid PK", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "token_sha256 bytea NN UQ", "created_at timestamptz NN", "expires_at timestamptz NN", "used_at timestamptz NULL"]
    pk: [id]
  # ---------- privacy
  - name: consent_purposes
    module: privacy
    columns: ["code text PK (health_profile|personalization|photo_contribution|survey)", "name_vi text NN", "description_vi text NN", "data_category text NN", "is_sensitive bool NN", "is_required bool NN D false"]
    pk: [code]
  - name: policy_versions
    module: privacy
    columns: ["id uuid PK", "purpose_code text NN FK->consent_purposes(code)", "version text NN", "text_sha256 bytea NN", "effective_from timestamptz NN"]
    pk: [id]
    unique: [[purpose_code, version]]
  - name: consent_events
    module: privacy
    columns: ["id uuid PK", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "policy_version_id uuid NN FK->policy_versions(id)", "action enum(grant,withdraw) NN", "channel enum(onboarding,settings) NN", "app_version text NULL", "created_at timestamptz NN"]
    pk: [id]
    notes: "chỉ ghi thêm; trạng thái hiện tại = sự kiện mới nhất mỗi mục đích (view v_current_consents)"
  - name: dsr_requests
    module: privacy
    columns: ["id uuid PK", "user_id uuid NULL FK->users(id) ON DELETE SET NULL", "subject_ref bytea NN (HMAC-SHA256 của user_id, giữ bằng chứng sau khi xoá)", "type enum(access,export,correct,delete,withdraw,restrict,object) NN", "status enum(received,in_progress,completed,rejected) NN", "received_at timestamptz NN", "acknowledged_at timestamptz NULL", "completed_at timestamptz NULL", "result_key text NULL", "note text NULL"]
    pk: [id]
  - name: audit_log
    module: privacy
    columns: ["id bigint PK identity", "actor_user_id uuid NULL FK->users(id) ON DELETE SET NULL", "actor_role text NN", "action text NN", "entity text NN", "entity_id text NULL", "purpose text NULL", "request_id text NULL", "created_at timestamptz NN"]
    pk: [id]
    notes: "chỉ ghi thêm; ghi mỗi lần giải mã cột sức khoẻ và mỗi thao tác nhân sự"
  # ---------- catalog
  - name: food_groups
    module: catalog
    columns: ["code text PK", "name_vi text NN"]
    pk: [code]
  - name: nutrient_sources
    module: catalog
    columns: ["id smallint PK", "code text NN UQ (fct2007|usda_sr_legacy|usda_foundation)", "name text NN", "version text NN", "license text NN", "url text NN"]
    pk: [id]
  - name: food_items
    module: catalog
    columns: ["source_id smallint NN FK->nutrient_sources(id)", "source_code text NN", "name text NN", "name_en text NULL", "refuse_pct numeric NULL CK(0..100)"]
    pk: [source_id, source_code]
  - name: nutrients
    module: catalog
    columns: ["code text PK (energy_kcal|protein_g|lipid_g|glucid_g|fiber_g|sugar_g|sodium_mg)", "name_vi text NN", "unit text NN"]
    pk: [code]
  - name: food_nutrients
    module: catalog
    columns: ["source_id smallint NN", "source_code text NN", "nutrient_code text NN FK->nutrients(code)", "per_100g numeric NN"]
    pk: [source_id, source_code, nutrient_code]
    fks: ["(source_id, source_code) -> food_items(source_id, source_code)"]
  - name: allergen_groups
    module: catalog
    columns: ["code text PK", "name_vi text NN", "name_en text NN", "basis enum(codex_2024,tastoria_extra) NN"]
    pk: [code]
  - name: diets
    module: catalog
    columns: ["code text PK", "name_vi text NN"]
    pk: [code]
  - name: diet_exclusions
    module: catalog
    columns: ["diet_code text NN FK->diets(code)", "food_group_code text NN FK->food_groups(code)"]
    pk: [diet_code, food_group_code]
  - name: ingredients
    module: catalog
    columns: ["id uuid PK", "name_vi text NN UQ", "food_group_code text NN FK->food_groups(code)", "comp_source_id smallint NULL", "comp_source_code text NULL", "is_staple bool NN D false", "countable bool NN D false", "shelf_life_days numeric NULL", "shelf_life_basis text NULL (FoodKeeper id hoặc hiệu chỉnh của nhóm)", "is_active bool NN D true", "created_at timestamptz NN", "updated_at timestamptz NN"]
    pk: [id]
    fks: ["(comp_source_id, comp_source_code) -> food_items(source_id, source_code)"]
    notes: "EP lấy qua FK tới food_items.refuse_pct, không chép vào đây (tránh phụ thuộc bắc cầu)"
  - name: ingredient_synonyms
    module: catalog
    columns: ["ingredient_id uuid NN FK->ingredients(id)", "synonym text NN", "lang enum(vi,en) NN", "source text NULL"]
    pk: [ingredient_id, synonym, lang]
  - name: ingredient_allergens
    module: catalog
    columns: ["ingredient_id uuid NN FK->ingredients(id)", "allergen_code text NN FK->allergen_groups(code)"]
    pk: [ingredient_id, allergen_code]
  - name: ingredient_units
    module: catalog
    columns: ["ingredient_id uuid NN FK->ingredients(id)", "unit_code text NN (qua|bo|cu|nhanh|mieng|goi|hop|cay|tep|con)", "grams_per_unit numeric NN CK(>0)", "source text NN"]
    pk: [ingredient_id, unit_code]
  - name: qty_levels
    module: catalog
    columns: ["food_group_code text NN FK->food_groups(code)", "level enum(it,vua,nhieu) NN", "g_min numeric NN", "g_max numeric NN", "CK(g_min <= g_max)"]
    pk: [food_group_code, level]
  - name: cooking_methods
    module: catalog
    columns: ["code text PK", "name_vi text NN"]
    pk: [code]
  - name: tags
    module: catalog
    columns: ["code text PK", "kind enum(flavor,texture,occasion) NN", "name_vi text NN"]
    pk: [code]
  - name: recipes
    module: catalog
    columns: ["id uuid PK", "name_vi text NN UQ", "slot enum(man,rau,canh) NN", "servings smallint NN CK(>0)", "method_code text NN FK->cooking_methods(code)", "status enum(draft,published,retired) NN D draft", "notes text NULL", "created_at timestamptz NN", "updated_at timestamptz NN"]
    pk: [id]
    unique: [[id, slot]]
    notes: "món đã published là bất biến (BR-CATALOG-01): sửa = tạo bản mới, retire bản cũ; tổng thời gian và nguyên liệu chính là giá trị dẫn xuất, không lưu"
  - name: recipe_ingredients
    module: catalog
    columns: ["recipe_id uuid NN FK->recipes(id)", "ingredient_id uuid NN FK->ingredients(id)", "grams numeric NN CK(>0) (khối lượng lúc mua cho `servings` khẩu phần)", "role enum(main,side,seasoning) NN", "is_optional bool NN D false"]
    pk: [recipe_id, ingredient_id]
  - name: recipe_steps
    module: catalog
    columns: ["recipe_id uuid NN FK->recipes(id)", "step_no smallint NN", "text_vi text NN", "kind enum(active,passive) NN", "minutes smallint NN CK(>0)", "uses_burner bool NN D false"]
    pk: [recipe_id, step_no]
  - name: recipe_tags
    module: catalog
    columns: ["recipe_id uuid NN FK->recipes(id)", "tag_code text NN FK->tags(code)"]
    pk: [recipe_id, tag_code]
  - name: recipe_sources
    module: catalog
    columns: ["recipe_id uuid NN FK->recipes(id)", "url text NN", "title text NN", "accessed_on date NN"]
    pk: [recipe_id, url]
  - name: recipe_nutrition
    module: catalog
    columns: ["recipe_id uuid NN FK->recipes(id)", "nutrient_code text NN FK->nutrients(code)", "per_serving numeric NN", "computed_at timestamptz NN", "data_version text NN"]
    pk: [recipe_id, nutrient_code]
    notes: "PHI CHUẨN HOÁ CÓ KIỂM SOÁT: giá trị dẫn xuất từ recipe_ingredients × food_nutrients × EP; tính lại bằng job khi kho món hoặc bảng thành phần đổi; data_version ghi phiên bản dữ liệu nguồn"
  - name: vision_classes
    module: catalog
    columns: ["id smallint PK", "code text NN UQ", "name_vi text NN", "name_en text NN", "countable bool NN", "instance_def enum(item,group_of,package) NN", "has_freshness_model bool NN D false"]
    pk: [id]
  - name: vision_class_ingredients
    module: catalog
    columns: ["vision_class_id smallint NN FK->vision_classes(id)", "ingredient_id uuid NN FK->ingredients(id)", "is_default bool NN D false"]
    pk: [vision_class_id, ingredient_id]
  # ---------- profile
  - name: profiles
    module: profile
    columns: ["user_id uuid PK FK->users(id) ON DELETE CASCADE", "sex_enc bytea NULL", "birth_year_enc bytea NULL", "height_cm_enc bytea NULL", "weight_kg_enc bytea NULL", "enc_key_id text NULL", "activity_level enum(light,moderate,heavy) NULL", "goal enum(maintain,lose,expert) NULL", "kcal_target int NULL CK(800..5000)", "kcal_source enum(suggested,user,expert) NULL", "diet_code text NULL FK->diets(code)", "updated_at timestamptz NN"]
    pk: [user_id]
    notes: "users 1 — 0..1 profiles; cột *_enc mã hoá AES-GCM tầng ứng dụng, chỉ module profile giải mã (ghi audit_log)"
  - name: user_allergens
    module: profile
    columns: ["user_id uuid NN FK->users(id) ON DELETE CASCADE", "allergen_code text NN FK->allergen_groups(code)"]
    pk: [user_id, allergen_code]
  - name: user_favorite_recipes
    module: profile
    columns: ["user_id uuid NN FK->users(id) ON DELETE CASCADE", "recipe_id uuid NN FK->recipes(id)", "created_at timestamptz NN"]
    pk: [user_id, recipe_id]
    notes: "tối đa 5 món (kiểm ở service)"
  - name: user_settings
    module: profile
    columns: ["user_id uuid PK FK->users(id) ON DELETE CASCADE", "burners smallint NN D 2 CK(1..4)", "default_persons smallint NN D 2 CK(1..6)", "timezone text NN D 'Asia/Ho_Chi_Minh'", "updated_at timestamptz NN"]
    pk: [user_id]
  # ---------- pantry
  - name: pantry_lots
    module: pantry
    columns: ["id uuid PK", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "ingredient_id uuid NN FK->ingredients(id)", "initial_g_min numeric NN CK(>=0)", "initial_g_max numeric NN", "acquired_at timestamptz NN", "acquired_basis enum(purchase_date_entered,first_seen) NN", "status enum(in_stock,used_up,discarded,not_seen) NN D in_stock", "p_tuoi real NULL", "p_dung_som real NULL", "p_dung_ngay real NULL", "p_kiem_tra real NULL", "freshness_observed_at timestamptz NULL", "freshness_model_version_id uuid NULL FK->model_versions(id)", "user_checked_at timestamptz NULL (người dùng xác nhận đồ 'kiểm tra' vẫn dùng được)", "source_scan_item_id uuid NULL FK->scan_items(id) ON DELETE SET NULL", "created_at timestamptz NN", "updated_at timestamptz NN", "CK(initial_g_min <= initial_g_max)"]
    pk: [id]
    notes: "lượng hiện tại = initial + Σ giao dịch (view v_pantry_lot_balance); u tính lúc đọc (BR-FRESH-05); p_* là quan sát mới nhất của chính lô"
  - name: pantry_transactions
    module: pantry
    columns: ["id bigint PK identity", "lot_id uuid NN FK->pantry_lots(id) ON DELETE CASCADE", "delta_g_min numeric NN", "delta_g_max numeric NN", "reason enum(scan_add,cook_deduct,manual_edit,discard,undo) NN", "ref_type enum(scan,cook_session,user) NULL", "ref_id uuid NULL", "reverses_id bigint NULL FK->pantry_transactions(id)", "urgency_at_event real NULL", "created_at timestamptz NN"]
    pk: [id]
    notes: "chỉ ghi thêm; hoàn tác = ghi giao dịch đảo trỏ reverses_id"
  # ---------- mlops
  - name: model_versions
    module: mlops
    columns: ["id uuid PK", "name enum(detector,freshness,ranker,substitution) NN", "version text NN", "artifact_key text NN", "sha256 bytea NN", "preprocess_version text NULL", "metrics jsonb NN", "gate_report_key text NULL", "mlflow_run_id text NULL", "status enum(candidate,validated,rejected,retired) NN D candidate", "created_at timestamptz NN"]
    pk: [id]
    unique: [[name, version]]
    notes: "metrics là báo cáo không truy vấn (jsonb hợp lý); bản đang chạy xác định DUY NHẤT qua model_deployments"
  - name: model_version_classes
    module: mlops
    columns: ["model_version_id uuid NN FK->model_versions(id)", "class_index smallint NN", "vision_class_id smallint NN FK->vision_classes(id)"]
    pk: [model_version_id, class_index]
  - name: model_deployments
    module: mlops
    columns: ["name enum(detector,freshness,ranker,substitution) PK", "active_version_id uuid NN FK->model_versions(id)", "previous_version_id uuid NULL FK->model_versions(id)", "switched_at timestamptz NN", "switched_by uuid NULL FK->users(id) ON DELETE SET NULL"]
    pk: [name]
  # ---------- scan
  - name: scans
    module: scan
    columns: ["id uuid PK", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "mode enum(fridge,haul) NN", "status enum(queued,processing,done,failed,expired,confirmed,discarded) NN", "error_code text NULL", "attempts smallint NN D 0", "detector_version_id uuid NULL FK->model_versions(id)", "classifier_version_id uuid NULL FK->model_versions(id)", "preprocess_version text NULL", "enqueued_at timestamptz NULL", "started_at timestamptz NULL", "finished_at timestamptz NULL", "confirmed_at timestamptz NULL", "created_at timestamptz NN"]
    pk: [id]
  - name: scan_images
    module: scan
    columns: ["id uuid PK", "scan_id uuid NN FK->scans(id) ON DELETE CASCADE", "ordinal smallint NN CK(1..2)", "shelf_group smallint NN D 1 (cùng số = cùng ngăn → lấy max; khác số → cộng)", "storage_key text NN UQ", "width int NN", "height int NN", "contributed bool NN D false", "purged_at timestamptz NULL"]
    pk: [id]
    unique: [[scan_id, ordinal]]
  - name: scan_items
    module: scan
    columns: ["id uuid PK", "scan_id uuid NN FK->scans(id) ON DELETE CASCADE", "ingredient_id uuid NN FK->ingredients(id)", "origin enum(model,user_added) NN", "model_count smallint NULL", "final_count smallint NULL", "qty_level enum(it,vua,nhieu) NULL", "user_action enum(kept,relabeled,deleted,edited) NN D kept", "original_ingredient_id uuid NULL FK->ingredients(id)", "user_freshness enum(tuoi,dung_som,dung_ngay,kiem_tra) NULL", "created_at timestamptz NN", "updated_at timestamptz NN"]
    pk: [id]
    notes: "chip; ghi vào kho chỉ khi xác nhận (BR-SCAN-02)"
  - name: detections
    module: scan
    columns: ["id bigint PK identity", "scan_image_id uuid NN FK->scan_images(id) ON DELETE CASCADE", "scan_item_id uuid NULL FK->scan_items(id) ON DELETE SET NULL", "vision_class_id smallint NN FK->vision_classes(id)", "x1 real NN", "y1 real NN", "x2 real NN", "y2 real NN", "confidence real NN", "p_tuoi real NULL", "p_dung_som real NULL", "p_dung_ngay real NULL", "p_kiem_tra real NULL", "CK(0<=x1<x2<=1 AND 0<=y1<y2<=1)"]
    pk: [id]
  # ---------- substitute
  - name: substitution_pairs
    module: substitute
    columns: ["id uuid PK", "ingredient_id uuid NN FK->ingredients(id)", "substitute_id uuid NN FK->ingredients(id)", "context_slot enum(man,rau,canh) NULL", "context_method_code text NULL FK->cooking_methods(code)", "ratio numeric NN D 1", "score real NN", "source text NN", "curated bool NN", "CK(ingredient_id <> substitute_id)"]
    pk: [id]
    unique: [[ingredient_id, substitute_id, context_slot, context_method_code]]
  - name: ingredient_embeddings
    module: substitute
    columns: ["ingredient_id uuid NN FK->ingredients(id)", "model_version_id uuid NN FK->model_versions(id)", "vector vector(100) NN"]
    pk: [ingredient_id, model_version_id]
  - name: shopping_items
    module: substitute
    columns: ["id uuid PK", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "ingredient_id uuid NN FK->ingredients(id)", "qty_g numeric NULL", "note text NULL", "status enum(open,bought,dropped) NN D open", "source_meal_plan_item_id uuid NULL FK->meal_plan_items(id) ON DELETE SET NULL", "created_at timestamptz NN", "updated_at timestamptz NN"]
    pk: [id]
  # ---------- meal
  - name: meal_plans
    module: meal
    columns: ["id uuid PK", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "meal enum(lunch,dinner) NN", "persons smallint NN CK(1..6)", "max_minutes smallint NN CK(10..180)", "status enum(proposed,accepted,cooked,abandoned,expired) NN D proposed", "e_target_kcal numeric NULL (ảnh chụp lúc tạo)", "kcal_low numeric NULL", "kcal_high numeric NULL", "rice_bowls_per_person numeric NULL", "reason_vi text NN", "ranker_version_id uuid NULL FK->model_versions(id)", "params_version text NN", "created_at timestamptz NN", "updated_at timestamptz NN"]
    pk: [id]
    unique: [[id, user_id]]
    notes: "e_target_kcal, kcal_low/high là ảnh chụp lịch sử, không phải dẫn xuất lặp"
  - name: meal_plan_coeater_allergens
    module: meal
    columns: ["meal_plan_id uuid NN FK->meal_plans(id) ON DELETE CASCADE", "allergen_code text NN FK->allergen_groups(code)"]
    pk: [meal_plan_id, allergen_code]
  - name: meal_plan_pins
    module: meal
    columns: ["meal_plan_id uuid NN FK->meal_plans(id) ON DELETE CASCADE", "lot_id uuid NN FK->pantry_lots(id) ON DELETE CASCADE"]
    pk: [meal_plan_id, lot_id]
  - name: meal_plan_items
    module: meal
    columns: ["id uuid PK", "meal_plan_id uuid NN FK->meal_plans(id) ON DELETE CASCADE", "slot enum(man,rau,canh) NN", "recipe_id uuid NN", "status enum(active,swapped_out) NN D active", "replaced_item_id uuid NULL FK->meal_plan_items(id)", "swap_reason enum(khong_hop_gu,moi_an,thieu_thoi_gian,khac) NULL", "rank_score real NN", "servings_scale numeric NN", "kcal_per_person numeric NULL (ảnh chụp)", "created_at timestamptz NN"]
    pk: [id]
    fks: ["(recipe_id, slot) -> recipes(id, slot)"]
    unique_partial: ["UNIQUE(meal_plan_id, slot) WHERE status = 'active'"]
  - name: meal_plan_item_substitutions
    module: meal
    columns: ["item_id uuid NN FK->meal_plan_items(id) ON DELETE CASCADE", "original_ingredient_id uuid NN FK->ingredients(id)", "substitute_ingredient_id uuid NN FK->ingredients(id)", "grams numeric NN", "origin enum(lookup,embedding,user) NN", "created_at timestamptz NN"]
    pk: [item_id, original_ingredient_id]
  # ---------- cooking
  - name: cook_sessions
    module: cooking
    columns: ["id uuid PK", "meal_plan_id uuid NN FK->meal_plans(id) ON DELETE CASCADE", "status enum(in_progress,completed,reverted,abandoned) NN D in_progress", "serve_at timestamptz NN", "burners smallint NN (ảnh chụp)", "started_at timestamptz NN", "completed_at timestamptz NULL", "reverted_at timestamptz NULL", "created_at timestamptz NN"]
    pk: [id]
    notes: "meal_plans 1 — 0..* cook_sessions; không lưu user_id (truy qua meal_plans để giữ 3NF)"
  - name: cook_schedule_entries
    module: cooking
    columns: ["cook_session_id uuid NN FK->cook_sessions(id) ON DELETE CASCADE", "recipe_id uuid NN", "step_no smallint NN", "start_offset_s int NN", "end_offset_s int NN", "CK(start_offset_s < end_offset_s)"]
    pk: [cook_session_id, recipe_id, step_no]
    fks: ["(recipe_id, step_no) -> recipe_steps(recipe_id, step_no)"]
  # ---------- events
  - name: interactions
    module: events
    columns: ["id uuid PK (event_id do client sinh → chống trùng)", "user_id uuid NN FK->users(id) ON DELETE CASCADE", "recipe_id uuid NN FK->recipes(id)", "meal_plan_id uuid NULL", "meal_plan_item_id uuid NULL FK->meal_plan_items(id) ON DELETE SET NULL", "type enum(served,viewed,swapped,cooked,liked,disliked,undone) NN", "position smallint NULL", "swap_reason enum(khong_hop_gu,moi_an,thieu_thoi_gian,khac) NULL", "ranker_version_id uuid NULL FK->model_versions(id)", "propensity real NULL", "occurred_at timestamptz NN", "received_at timestamptz NN"]
    pk: [id]
    fks: ["(meal_plan_id, user_id) -> meal_plans(id, user_id) ON DELETE CASCADE"]
    notes: "FK ghép bảo đảm user_id khớp chủ mâm (không có phụ thuộc bắc cầu tự do); chỉ ghi khi có đồng ý personalization (BR-CONSENT-03)"
  # ---------- survey
  - name: survey_forms
    module: survey
    columns: ["id uuid PK", "version text NN UQ", "n_anchor smallint NN", "n_random smallint NN", "is_open bool NN D false", "created_at timestamptz NN"]
    pk: [id]
  - name: survey_form_anchors
    module: survey
    columns: ["form_id uuid NN FK->survey_forms(id)", "recipe_id uuid NN FK->recipes(id)"]
    pk: [form_id, recipe_id]
  - name: survey_respondents
    module: survey
    columns: ["id uuid PK", "form_id uuid NN FK->survey_forms(id)", "policy_version_id uuid NN FK->policy_versions(id)", "consented_at timestamptz NN", "completed_at timestamptz NULL", "channel enum(link,qr) NN"]
    pk: [id]
  - name: survey_assignments
    module: survey
    columns: ["respondent_id uuid NN FK->survey_respondents(id) ON DELETE CASCADE", "recipe_id uuid NN FK->recipes(id)", "display_order smallint NN", "is_anchor bool NN"]
    pk: [respondent_id, recipe_id]
  - name: survey_ratings
    module: survey
    columns: ["respondent_id uuid NN", "recipe_id uuid NN", "rating smallint NULL CK(1..5)", "never_eaten bool NN D false", "answered_at timestamptz NN", "CK((rating IS NULL) = never_eaten)"]
    pk: [respondent_id, recipe_id]
    fks: ["(respondent_id, recipe_id) -> survey_assignments(respondent_id, recipe_id) ON DELETE CASCADE"]
  - name: survey_favorites
    module: survey
    columns: ["respondent_id uuid NN FK->survey_respondents(id) ON DELETE CASCADE", "recipe_id uuid NN FK->recipes(id)"]
    pk: [respondent_id, recipe_id]

views:
  - {name: v_current_consents, module: privacy, desc: "đồng ý hiện hành theo (user, mục đích) = consent_event mới nhất"}
  - {name: v_pantry_lot_balance, module: pantry, desc: "lượng hiện tại [g_min, g_max] = initial + Σ delta, chặn dưới 0"}
  - {name: v_journal_days, module: journal, desc: "theo ngày địa phương: số mâm đã nấu, kcal/người, mục tiêu ảnh chụp, số lô gấp được dùng kịp"}

