  - {id: UC14, pkg: PK4, name: "Quản lý kho (sửa lượng, ngày mua, bỏ đồ, xác nhận đồ cần kiểm tra)", primary: A02, secondary: [], priority: M, rules: [BR-PANTRY-01, BR-FRESH-01, BR-FRESH-03, BR-FRESH-04, BR-FRESH-05]}
  - {id: UC15, pkg: PK5, name: "Nhận mâm cơm hôm nay", primary: A02, secondary: [], priority: M, rules: [BR-TRAY-01, BR-TRAY-02, BR-TRAY-03, BR-TRAY-04, BR-TRAY-05, BR-TRAY-06, BR-TRAY-07, BR-TRAY-08, BR-ALG-01, BR-DIET-01, BR-NUT-04, BR-NUT-06, BR-CONSENT-03]}
