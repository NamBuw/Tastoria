  - {id: UC23, pkg: PK7, name: "Tham gia khảo sát gu món ăn", primary: A03, secondary: [], priority: M, rules: [BR-CONSENT-01]}
  - {id: UC24, pkg: PK7, name: "Quản lý đợt khảo sát (tạo phiếu, xuất kết quả)", primary: A06, secondary: [], priority: S}
  - {id: UC25, pkg: PK8, name: "Nhập và kiểm tra kho công thức, nguyên liệu", primary: A05, secondary: [], priority: M, rules: [BR-NUT-05, BR-ALG-01]}
  - {id: UC26, pkg: PK8, name: "Quản lý cặp thay thế nguyên liệu", primary: A05, secondary: [], priority: S}
  - {id: UC27, pkg: PK8, name: "Xử lý yêu cầu dữ liệu và xem nhật ký kiểm toán", primary: A04, secondary: [], priority: S, rules: [BR-DSR-01]}
  - {id: UC28, pkg: PK9, name: "Xuất dữ liệu huấn luyện đã bí danh hoá", primary: A06, secondary: [], priority: S, rules: [BR-CONSENT-03]}
  - {id: UC29, pkg: PK9, name: "Đăng ký và kiểm định phiên bản mô hình", primary: A06, secondary: [], priority: M}
