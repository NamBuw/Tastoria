# Tastoria — mô hình phân tích thiết kế: nguồn sự thật duy nhất cho SRS, UML, ERD, API, kiểm thử.
# Mọi tài liệu và sơ đồ phải dùng đúng mã (A.., PK.., UC.., M.., bảng, endpoint) trong file này.
# Thiết kế: docs/superpowers/specs/2026-10-17-tastoria-thiet-ke-v2.md (BR-*, NFR-* định nghĩa ở §4 và §11).
version: 1
updated: "2026-10-17"

actors:
  - {id: A01, name: "Khách", kind: human, desc: "Người chưa đăng nhập: xem landing, đăng ký, đăng nhập, đặt lại mật khẩu"}
  - {id: A02, name: "Người dùng", kind: human, generalizes: A01, desc: "Người nấu có tài khoản; chủ hồ sơ, kho, mâm"}
  - {id: A03, name: "Người tham gia khảo sát", kind: human, desc: "Chấm điểm món qua link khảo sát, ẩn danh, không cần tài khoản"}
  - {id: A04, name: "Quản trị viên", kind: human, desc: "Xử lý yêu cầu dữ liệu thủ công, xem nhật ký kiểm toán, quản lý tài khoản nhân sự"}
  - {id: A05, name: "Người biên soạn công thức", kind: human, desc: "Soạn và nhập kho món, nguyên liệu, cặp thay thế (CLI)"}
  - {id: A06, name: "Người vận hành mô hình", kind: human, desc: "Xuất dữ liệu huấn luyện, đăng ký, kiểm định, triển khai, quay lui mô hình; quản lý đợt khảo sát"}
  - {id: A07, name: "Người gán nhãn", kind: human, desc: "Gán khung/nhãn độ tươi cho ảnh trong công cụ gán nhãn"}
  - {id: A08, name: "Bộ lập lịch", kind: time, desc: "Kích hoạt tác vụ định kỳ (cron)"}
  - {id: A09, name: "Dịch vụ email", kind: external_system, desc: "Gửi thư đặt lại mật khẩu (SMTP; môi trường dev dùng Mailpit)"}
  - {id: A10, name: "Công cụ gán nhãn", kind: external_system, desc: "Label Studio tự host; nhận ảnh góp, trả nhãn"}

packages:
  - {id: PK1, name: "Tài khoản & bảo mật"}
  - {id: PK2, name: "Quyền riêng tư"}
  - {id: PK3, name: "Hồ sơ & mục tiêu"}
  - {id: PK4, name: "Kho & quét"}
  - {id: PK5, name: "Mâm cơm"}
  - {id: PK6, name: "Nấu & nhật ký"}
  - {id: PK7, name: "Khảo sát gu"}
  - {id: PK8, name: "Quản trị nội dung & dữ liệu"}
  - {id: PK9, name: "Vận hành mô hình"}
  - {id: PK10, name: "Tác vụ định kỳ"}

