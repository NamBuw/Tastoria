# Lệnh CLI (ranh giới cho actor nhân sự; chạy trong container api)
cli:
  - {cmd: "tastoria catalog import <bundle_dir>", module: admin, use_cases: [UC25], desc: "kiểm tra + nhập YAML/CSV món, nguyên liệu; tính lại recipe_nutrition"}
  - {cmd: "tastoria catalog substitutes import <file>", module: admin, use_cases: [UC26]}
  - {cmd: "tastoria survey create-form --anchors N --random M", module: admin, use_cases: [UC24]}
  - {cmd: "tastoria survey export <form_version>", module: admin, use_cases: [UC24]}
  - {cmd: "tastoria mlops export-training-data --since <date>", module: admin, use_cases: [UC28]}
  - {cmd: "tastoria mlops register <name> <artifact> --metrics <json>", module: admin, use_cases: [UC29]}
  - {cmd: "tastoria mlops gate <name> <version>", module: admin, use_cases: [UC29]}
  - {cmd: "tastoria mlops deploy <name> <version>", module: admin, use_cases: [UC30]}
  - {cmd: "tastoria mlops rollback <name>", module: admin, use_cases: [UC30]}
  - {cmd: "tastoria labeling push|pull", module: admin, use_cases: [UC31]}
  - {cmd: "python -m tastoria.jobs.purge_images", module: jobs, use_cases: [UC32]}
  - {cmd: "python -m tastoria.jobs.backup", module: jobs, use_cases: [UC33]}
  - {cmd: "python -m tastoria.jobs.sweep", module: jobs, use_cases: [UC34]}

# Máy trạng thái cần vẽ (sơ đồ state machine UML)
state_machines:
  - {entity: scans, states: [queued, processing, done, failed, expired, confirmed, discarded]}
  - {entity: meal_plans, states: [proposed, accepted, cooked, abandoned, expired]}
  - {entity: cook_sessions, states: [in_progress, completed, reverted, abandoned]}
  - {entity: "consent (theo mục đích)", states: [none, granted, withdrawn, superseded]}
  - {entity: pantry_lots, states: [in_stock, not_seen, used_up, discarded]}
  - {entity: "users (tài khoản)", states: [active, locked, deletion_requested, deleted]}
