  - {id: UC08, pkg: PK2, name: "Yêu cầu sửa, hạn chế hoặc phản đối xử lý", primary: A02, secondary: [A04], priority: C, rules: [BR-DSR-01]}
  - {id: UC09, pkg: PK3, name: "Thiết lập hồ sơ 60 giây", primary: A02, secondary: [], priority: M, rels: [{include: UC05}], rules: [BR-NUT-01, BR-NUT-02, BR-NUT-03, BR-CONSENT-02]}
