components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT 15 phút (header có `kid`; claim `sub` = users.id, `role`, `tv` = users.token_version). token_version
        tăng (đăng xuất mọi nơi, rút đồng ý, đổi mật khẩu) thì token cũ bị từ chối với 401 token_revoked.
    respondentToken:
      type: apiKey
      in: header
      name: X-Respondent-Token
      description: Token người tham gia khảo sát (A03) nhận từ POST /survey/respondents; chỉ mở được phiếu của chính người
        đó.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Khoá do client sinh (UUIDv4/v7) cho mỗi thao tác logic. Server lưu (user_id, key, request_sha256, status_code,
        response_body) trong idempotency_keys 48 giờ. Gửi lại cùng khoá + cùng thân → trả lại nguyên văn phản hồi đã lưu kèm
        `Idempotent-Replayed: true`; cùng khoá + thân khác → 422 idempotency_key_reused; yêu cầu đầu còn đang chạy → 409 idempotency_in_progress.'
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: Phiên bản app (semver). Thấp hơn bản tối thiểu server còn hỗ trợ → 412 app_too_old. Trình duyệt trang khảo
        sát không gửi thì bỏ qua kiểm tra.
      schema:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        examples:
        - 1.4.0
    Cursor:
      name: cursor
      in: query
      required: false
      description: Con trỏ keyset lấy từ next_cursor của trang trước
      schema:
        $ref: '#/components/schemas/PageCursor'
    Limit:
      name: limit
      in: query
      required: false
      description: Số phần tử mỗi trang
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Purpose:
      name: purpose
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConsentPurposeCode'
    Ordinal:
      name: ordinal
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2
    Wait:
      name: wait
      in: query
      required: false
      description: 'Long-poll: giữ kết nối tối đa `wait` giây cho tới khi status rời {queued, processing}; 0 = trả ngay'
      schema:
        type: integer
        minimum: 0
        maximum: 10
        default: 0
  headers:
    Location:
      description: URL tài nguyên vừa tạo hoặc nơi theo dõi tiến độ
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Số giây nên chờ trước khi gọi lại
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: true khi phản hồi là bản lưu của lần gọi trước cùng Idempotency-Key
      schema:
        type: boolean
    XAccelRedirect:
      description: Do nginx xử lý (location internal); client nhận thân tệp, không thấy header này
      schema:
        type: string
  responses:
    BadRequest:
      description: '400: thân hoặc tham số sai cú pháp/kiểu'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation_error:
              value:
                type: https://tastoria.ctslab.net/problems/validation_error
                title: Dữ liệu không hợp lệ
                status: 400
                code: validation_error
    Unauthorized:
      description: '401: chưa xác thực, token hết hạn hoặc đã bị thu hồi theo token_version'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: https://tastoria.ctslab.net/problems/unauthenticated
                title: Chưa đăng nhập hoặc phiên đã hết hạn
                status: 401
                code: unauthenticated
            token_revoked:
              value:
                type: https://tastoria.ctslab.net/problems/token_revoked
                title: Phiên đã bị thu hồi, cần làm mới
                status: 401
                code: token_revoked
    Forbidden:
      description: '403: không đủ quyền hoặc thiếu đồng ý'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: https://tastoria.ctslab.net/problems/forbidden
                title: Không đủ quyền
                status: 403
                code: forbidden
            consent_required:
              value:
                type: https://tastoria.ctslab.net/problems/consent_required
                title: Cần đồng ý mục đích xử lý dữ liệu
                status: 403
                code: consent_required
    NotFound:
      description: '404: không có hoặc không thuộc người gọi'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_found:
