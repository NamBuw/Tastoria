        source: FR-06-09
      - code: request_not_downloadable
        status: '409'
        when: Tải tệp cho yêu cầu không phải `export`
        source: UC06
      - code: export_expired
        status: '410'
        when: Tệp xuất đã bị dọn khỏi volume
        source: UC06
      - code: age_below_minimum
        status: '422'
        when: Năm sinh cho tuổi < 18 (BR-NUT-01)
        source: FR-09-05, FR-10-03
      - code: age_confirmation_required
        status: '422'
        when: Năm hiện tại − năm sinh = 18 mà thiếu `adult_confirmed = true` (BR-NUT-01)
        source: FR-09-13
      - code: profile_incomplete
        status: '422'
        when: Thiếu giới, năm sinh, cân nặng hoặc mức vận động để tính gợi ý; kèm danh sách trường
        source: FR-11-14
      - code: unknown_code
        status: '422'
        when: Mã dị ứng hoặc chế độ ăn không có trong danh mục
        source: UC09, UC10
      - code: favorites_limit
        status: '422'
        when: Quá 5 món hay ăn
        source: FR-10-11
      - code: recipe_not_published
        status: '422'
        when: Món hay ăn không ở trạng thái `published`
        source: FR-10-11
      - code: below_floor_confirmation_required
        status: '409'
        when: Mục tiêu tự nhập dưới sàn 1.200/1.500 kcal mà chưa có `confirm_below_floor = true`
        source: FR-11-12
      - code: decryption_failed
        status: '500'
        when: Không giải mã được cột sức khoẻ (khoá `enc_key_id` không còn)
        source: UC10, UC11
      - code: image_too_large
        status: '413'
        when: Ảnh lớn hơn 3 MB
        source: FR-12-02
      - code: unsupported_media_type
        status: '415'
        when: Magic bytes cho thấy tệp không phải ảnh
        source: FR-12-03
      - code: image_too_many_pixels
        status: '422'
        when: Ảnh lớn hơn 4096 × 4096 điểm ảnh
        source: FR-12-04
      - code: model_unavailable
        status: '503'
        when: Không có bản `detector` đang chạy; xem `Retry-After`
        source: UC12
      - code: queue_full
        status: '503'
        when: Hàng đợi suy luận quá dài; xem `Retry-After`
        source: UC12
      - code: scan_not_editable
        status: '409'
        when: Thêm, sửa, xoá chip khi scan không ở `done`
        source: FR-13-07
      - code: invalid_scan_state
        status: '409'
        when: Xác nhận hoặc bỏ scan ở trạng thái không cho phép (`queued`, `processing`, `failed`, `expired`, `discarded`)
        source: FR-13-18
      - code: duplicate_item
        status: '409'
        when: Thêm nguyên liệu đã có chip trong cùng scan
        source: FR-13-05
      - code: unknown_ingredient
        status: '422'
        when: '`ingredient_id` không tồn tại hoặc `is_active = false`'
        source: UC13
      - code: qty_kind_mismatch
        status: '422'
        when: Số đếm cho nguyên liệu không đếm được, hoặc mức lượng cho đồ đếm được
        source: UC13
      - code: qty_level_required
        status: '422'
        when: Còn chip không đếm được chưa chọn mức; kèm danh sách chip
        source: FR-13-11
      - code: unit_conversion_missing
        status: '422'
        when: Đồ đếm được chưa có dòng `ingredient_units`
        source: UC13
      - code: freshness_check_required
        status: '409'
        when: Còn chip nhãn "kiểm tra trước khi dùng" chưa xác nhận (BR-FRESH-04); kèm danh sách chip
        source: FR-13-09
      - code: image_purged
        status: '410'
        when: Ảnh gốc đã xoá theo hạn 30 ngày (BR-RETAIN-01)
        source: UC13
      - code: acquired_at_in_future
        status: '422'
        when: Ngày mua ở tương lai
        source: UC14
      - code: invalid_lot_transition
        status: '409'
        when: Chuyển trạng thái lô bằng tay không nằm trong FR-14-13
        source: FR-14-13
      - code: lot_closed
        status: '409'
        when: Sửa lô đã `discarded` hoặc `used_up`
        source: UC14
      - code: lot_not_check_level
        status: '409'
        when: Xác nhận "vẫn dùng được" cho lô không ở mức "kiểm tra"
        source: FR-14-14
      - code: no_feasible_tray
        status: '422'
        when: Không có mâm khả thi (BR-TRAY-06); kèm nguyên liệu thiếu của 3 mâm tốt nhất
        source: UC15
      - code: pin_unsatisfiable
        status: '422'
        when: Không mâm nào dùng đủ lô ghim (BR-TRAY-08); kèm id lô
        source: UC15
      - code: no_alternative
        status: '422'
        when: Không còn món thay khả thi cho slot (BR-SWAP-01)
        source: UC16
      - code: meal_plan_not_accepted
        status: '409'
        when: Tạo phiên nấu cho mâm còn `proposed`
        source: FR-19-01
      - code: meal_plan_not_cookable
        status: '409'
        when: Tạo phiên nấu cho mâm `cooked`, `abandoned` hoặc `expired`
        source: UC19
      - code: cook_session_in_progress
        status: '409'
        when: Mâm đã có phiên `in_progress`; kèm `cook_session_id`
        source: FR-19-02
      - code: cook_session_not_in_progress
        status: '409'
        when: Nấu xong hoặc bỏ phiên không ở `in_progress`
        source: UC19, UC20
      - code: cook_session_not_completed
        status: '409'
        when: Hoàn tác phiên không ở `completed`
        source: UC21
      - code: undo_window_expired
        status: '409'
        when: Quá 10 phút kể từ khi nấu xong (BR-PANTRY-02)
        source: UC21
      - code: recipe_without_steps
        status: '422'
        when: Món trong mâm không có bước nấu để lập lịch
        source: UC19
      - code: invalid_iso_week
        status: '422'
        when: Tham số `week` không phải tuần ISO 8601 hợp lệ
        source: FR-22-08
      - code: respondent_token_invalid
        status: '401'
        when: '`X-Respondent-Token` thiếu, sai, hết hạn hoặc thuộc người tham gia khác'
        source: UC23
      - code: survey_closed
        status: '409'
        when: Không có phiếu đang mở, hoặc phiếu đã đóng khi đang làm
        source: UC23, UC24
      - code: survey_already_completed
        status: '409'
        when: Ghi sau khi phiếu đã hoàn tất
        source: UC23
      - code: survey_incomplete
        status: '422'
        when: Nộp phiếu khi còn món chưa trả lời; kèm danh sách `recipeId`
        source: FR-23-12
      - code: invalid_rating
        status: '422'
        when: Điểm ngoài 1–5 hoặc có điểm đồng thời `never_eaten = true`
        source: FR-23-08
      - code: invalid_favorites
        status: '422'
        when: Quá 5 món, món trùng hoặc món không `published`
        source: FR-23-11
      - code: survey_form_misconfigured
        status: '503'
        when: Kho món `published` ít hơn số món ngẫu nhiên của phiếu
        source: UC23
      - code: internal_error
        status: '500'
        when: Lỗi không lường trước ở server; giao dịch đã rollback; xem `request_id`
        source: NFR-REL-01
    FieldError:
      type: object
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) tới trường lỗi trong thân, hoặc `#/query/<tên>` cho tham số
          examples:
          - /persons
        code:
          type: string
          description: Mã lỗi cấp trường, ví dụ `out_of_range`, `required`, `max_items`
          examples:
          - out_of_range
        message:
          type: string
          description: Mô tả tiếng Việt cho người đọc
      required:
      - pointer
      - code
      - message
    Problem:
      type: object
      description: Chi tiết lỗi theo RFC 9457 (`application/problem+json`). Cho phép thêm trường mở rộng theo từng `code`.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI định danh loại lỗi, dạng `https://tastoria.ctslab.net/problems/<code>`
        title:
          type: string
          description: Tóm tắt ngắn, tiếng Việt, không đổi theo lần xảy ra
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Giải thích riêng cho lần xảy ra này
        instance:
          type: string
          format: uri-reference
          description: Đường dẫn yêu cầu gây lỗi
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
          description: Trùng `request_id` trong log JSON và `audit_log.request_id`
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Danh sách lỗi cấp trường (khi code = validation_error)
      required:
      - type
      - title
      - status
      - code
    TrayShortfall:
      type: object
      description: Một trong 3 mâm tốt nhất và nguyên liệu còn thiếu (BR-TRAY-06)
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 3
        recipe_ids:
          type: array
          items:
            type: string
            format: uuid
        missing:
          type: array
          items:
            type: object
            properties:
              ingredient_id:
                type: string
                format: uuid
              name_vi:
                type: string
              need_g:
                type: number
                minimum: 0
              available_g_min:
                type: number
                minimum: 0
            required:
            - ingredient_id
            - name_vi
            - need_g
            - available_g_min
      required:
      - rank
      - recipe_ids
      - missing
    InfeasibleTrayProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          shortfalls:
            type: array
            maxItems: 3
            items:
              $ref: '#/components/schemas/TrayShortfall'
          unmet_pinned_lot_ids:
            type: array
            items:
              type: string
              format: uuid
            description: Lô ghim không mâm nào dùng được ≥ 50% g_min (BR-TRAY-08); gợi ý bỏ ghim
      description: Problem với code = no_feasible_tray (kèm 3 mâm tốt nhất và đồ thiếu), pin_unsatisfiable (kèm id lô ghim)
        hoặc no_alternative
    PageCursor:
      type: string
      description: Con trỏ keyset mờ (base64url của (created_at, id)); lấy từ next_cursor
    UserRole:
      type: string
      enum:
      - user
      - admin
      - curator
      - ml_operator
    UserSummary:
      type: object
      description: Tài khoản (bảng users), không gồm password_hash/token_version
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          type: string
          enum:
          - active
          - deletion_requested
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - status
      - created_at
    AuthSession:
      type: object
      properties:
        access_token:
          type: string
          description: JWT, hạn 15 phút, header có `kid` (NFR-SEC-01)
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 900
        refresh_token:
          type: string
          description: Chuỗi ngẫu nhiên; server chỉ lưu SHA-256 (refresh_tokens.token_sha256); hạn 30 ngày, xoay vòng mỗi
            lần dùng
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - refresh_expires_at
      - user
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
      required:
      - email
      - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      additionalProperties: false
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Token của thiết bị cần đăng xuất; family của nó bị thu hồi
      required:
      - refresh_token
      additionalProperties: false
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
      additionalProperties: false
    PasswordResetConfirm:
      type: object
      properties:
        token:
          type: string
          description: Token trong thư; server so với password_resets.token_sha256
        new_password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
      required:
      - token
      - new_password
      additionalProperties: false
    ConsentPurposeCode:
      type: string
      enum:
      - health_profile
      - personalization
      - photo_contribution
      - survey
    ConsentPurpose:
      type: object
      description: Bảng consent_purposes
      properties:
        code:
          $ref: '#/components/schemas/ConsentPurposeCode'
        name_vi:
          type: string
        description_vi:
          type: string
        data_category:
          type: string
        is_sensitive:
          type: boolean
        is_required:
          type: boolean
      required:
      - code
      - name_vi
      - description_vi
      - data_category
      - is_sensitive
      - is_required
    PolicyVersion:
      type: object
      description: Bảng policy_versions (phiên bản hiện hành của một mục đích)
      properties:
        id:
          type: string
          format: uuid
        purpose_code:
          $ref: '#/components/schemas/ConsentPurposeCode'
        version:
          type: string
        text_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 dạng hex chữ thường
        effective_from:
          type: string
          format: date-time
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        text_vi:
          type: string
          description: Nội dung điều khoản; server kiểm SHA-256 khớp text_sha256 trước khi trả
      required:
      - id
      - purpose_code
      - version
      - text_sha256
      - effective_from
      - purpose
      - text_vi
    ConsentState:
      type: object
      description: Một dòng của view v_current_consents, kèm phiên bản hiện hành để client biết cần hỏi lại
      properties:
        purpose_code:
          $ref: '#/components/schemas/ConsentPurposeCode'
        state:
          type: string
          enum:
          - none
          - granted
          - withdrawn
          - superseded
          description: superseded = đã đồng ý một phiên bản điều khoản cũ hơn phiên bản hiện hành
        policy_version_id:
          type:
          - string
          - 'null'
          format: uuid
        version:
          type:
          - string
          - 'null'
        current_policy_version_id:
          type: string
          format: uuid
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - purpose_code
      - state
      - policy_version_id
      - version
      - current_policy_version_id
      - decided_at
    ConsentWithdrawResult:
      allOf:
      - $ref: '#/components/schemas/ConsentState'
      - type: object
        properties:
          data_request_id:
            type:
            - string
            - 'null'
            format: uuid
            description: dsr_requests loại withdraw xoá dữ liệu của mục đích (BR-CONSENT-04); null khi mục đích chưa có dữ liệu
              cần xoá
    ConsentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentState'
      required:
      - items
    ConsentDecision:
      type: object
      properties:
        policy_version_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
          - grant
          - withdraw
      required:
      - policy_version_id
      - action
    ConsentDecisionBatch:
      type: object
      description: Ghi thêm consent_events; không có ô tích sẵn (BR-CONSENT-01)
      properties:
        channel:
          type: string
          enum:
          - onboarding
          - settings
        decisions:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/ConsentDecision'
      required:
      - channel
      - decisions
      additionalProperties: false
    ConsentWithdrawRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
          - onboarding
          - settings
          default: settings
      additionalProperties: false
    DataRequestType:
      type: string
      enum:
      - access
      - export
      - correct
      - delete
      - withdraw
      - restrict
      - object
    DataRequestStatus:
      type: string
      enum:
      - received
      - in_progress
      - completed
      - rejected
    DataRequestCreate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DataRequestType'
        note:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Bắt buộc với correct/restrict/object (mô tả nội dung yêu cầu)
        password:
          type:
          - string
          - 'null'
          maxLength: 256
          description: Mật khẩu hiện tại, bắt buộc với type = delete (UC07 bước 3); sai → 403 reauth_failed
      required:
      - type
      additionalProperties: false
    DataRequest:
      type: object
      description: Bảng dsr_requests nhìn từ chủ thể dữ liệu (không lộ subject_ref, result_key)
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DataRequestType'
        status:
          $ref: '#/components/schemas/DataRequestStatus'
        received_at:
          type: string
          format: date-time
        acknowledged_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        due_at:
          type: string
          format: date-time
          description: received_at + 24 giờ (NFR-PRIV-01)
        download_available:
          type: boolean
          description: true khi type ∈ {access, export}, status = completed và tệp còn hạn
        note:
          type:
          - string
          - 'null'
      required:
      - id
      - type
      - status
      - received_at
      - acknowledged_at
      - completed_at
      - due_at
      - download_available
      - note
    Profile:
      type: object
      description: Hồ sơ (profiles + user_allergens + user_favorite_recipes). Mỗi lần giải mã cột *_enc ghi audit_log
      properties:
        sex:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - null
          description: Giải mã từ profiles.sex_enc
        birth_year:
          type:
          - integer
          - 'null'
          description: Giải mã từ profiles.birth_year_enc
        height_cm:
          type:
          - number
          - 'null'
          description: Giải mã từ profiles.height_cm_enc
        weight_kg:
          type:
          - number
          - 'null'
          description: Giải mã từ profiles.weight_kg_enc
        activity_level:
          type:
          - string
          - 'null'
          enum:
          - light
          - moderate
          - heavy
          - null
        goal:
          type:
          - string
          - 'null'
          enum:
          - maintain
          - lose
          - expert
          - null
        kcal_target:
          type:
          - integer
          - 'null'
          minimum: 800
          maximum: 5000
        kcal_source:
          type:
          - string
          - 'null'
          enum:
          - suggested
          - user
          - expert
          - null
        diet_code:
          type:
          - string
          - 'null'
        allergen_codes:
          type: array
          items:
            type: string
          description: user_allergens.allergen_code
        favorite_recipe_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
          description: user_favorite_recipes.recipe_id
        health_profile_consented:
          type: boolean
          description: false → mọi chỉ số cơ thể là null, app hiện 'chưa có mục tiêu' (BR-CONSENT-02)
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        target_stale:
          type: boolean
          description: FR-10-04. Với kcal_source = suggested, true khi công thức hiện tại cho kết quả khác mục tiêu đã
            lưu (mục tiêu không bao giờ bị đổi ngầm)
        suggested_kcal:
          type:
          - integer
          - 'null'
          description: FR-10-04. Kết quả công thức hiện tại khi kcal_source = suggested; null khi không tính được
      required:
      - sex
      - birth_year
      - height_cm
      - weight_kg
      - activity_level
      - goal
      - kcal_target
      - kcal_source
      - diet_code
      - allergen_codes
      - favorite_recipe_ids
      - health_profile_consented
      - updated_at
    ProfileUpdate:
      type: object
      description: Ghi đè toàn bộ phần chỉ số của hồ sơ (PUT). Có chỉ số khác null mà chưa đồng ý health_profile → 403 consent_required
      properties:
        sex:
          type:
          - string
          - 'null'
