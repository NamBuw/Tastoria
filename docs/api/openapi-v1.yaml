# Tastoria — OpenAPI 3.1 cho 70 endpoint trong docs/sad/model.yaml.
# Định danh (module, UC, bảng, cột) lấy đúng từ model.yaml; không sửa tay mã ngoài model.
openapi: 3.1.0
info:
  title: Tastoria API
  version: 1.0.0
  summary: Hợp đồng HTTP của backend Tastoria (modular monolith FastAPI)
  description: |-
    Nguồn mã định danh: `docs/sad/model.yaml` (70 endpoint, module M01–M16, use case UC01–UC34). Thiết kế: `docs/superpowers/specs/2026-10-17-tastoria-thiet-ke-v2.md` §8.

    **Quy ước chung**
    - Tiền tố `/api/v1` cho mọi endpoint trừ `/healthz`, `/readyz` (ở gốc).
    - Id công khai là UUID. Mọi truy vấn theo `{id}` lọc theo chủ sở hữu; tài nguyên của người khác trả 404 (chống BOLA).
    - Lỗi theo RFC 9457 `application/problem+json`, có `code` ổn định (schema `ProblemCode`).
    - `Idempotency-Key` bắt buộc ở các thao tác `x-idempotency: idempotency-key` (POST /scans, /meal-plans, swap, /cook-sessions, /complete); lưu 48 giờ.
    - `x-idempotency: idempotent` nghĩa là gọi lại cùng thân cho cùng kết quả mà không cần khoá; `event-id` là chống trùng theo event_id trong thân; `none` là mỗi lần gọi tạo tài nguyên mới.
    - Phân trang keyset: `cursor` + `limit` (≤ 100) → `next_cursor` (null khi hết).
    - Thời gian ISO 8601 có múi giờ; tuần theo ISO 8601; múi giờ mặc định Asia/Ho_Chi_Minh.
    - Header `X-App-Version` từ app; quá cũ → 412 `app_too_old`.
    - Tác vụ bất đồng bộ trả 202 + `Location` + `Retry-After`.
    - Endpoint nhân sự (`/admin/*`) yêu cầu vai trò ghi ở `x-required-role`; các thao tác nhân sự còn lại chạy bằng CLI `tastoria ...` (xem model.yaml mục cli).
    - Mở rộng: `x-use-cases` (UC trong model.yaml), `x-module` (M01–M16), `x-idempotency`, `x-required-role`.
  license:
    name: Nội bộ — đồ án học phần
    identifier: LicenseRef-Tastoria-Internal
servers:
- url: /api/v1
  description: Tương đối theo máy chủ triển khai (nginx → api)
tags:
- name: core
  description: M01 — DB session, Unit of Work, lỗi RFC 9457, Idempotency-Key, cấu hình, lưu tệp, bảo mật dùng chung
- name: identity
  description: M02 — Tài khoản, mật khẩu, JWT, refresh token, đặt lại mật khẩu, khoá đăng nhập
- name: privacy
  description: M03 — Mục đích đồng ý, phiên bản điều khoản, nhật ký đồng ý, yêu cầu chủ thể dữ liệu, nhật ký kiểm toán
- name: catalog
  description: M04 — Thành phần thực phẩm, nguyên liệu, món, bước, dinh dưỡng món, lớp thị giác, dữ liệu tham chiếu
- name: profile
  description: M05 — Hồ sơ (cột sức khỏe mã hoá), dị ứng, chế độ ăn, món hay ăn, cài đặt; công thức BMR/TEE/E_mâm; get_meal_constraints()
- name: pantry
  description: M06 — Lô, giao dịch kho, quy đổi lượng, độ gấp u (tính lúc đọc)
- name: scan
  description: M08 — Nhận ảnh, job suy luận (worker), chip, xác nhận vào kho
- name: events
  description: M09 — Ghi tương tác có cổng đồng ý, chống trùng theo event_id
- name: substitute
  description: M10 — Cặp thay thế, embedding nguyên liệu, gợi ý thay thế có lọc cứng, danh sách đi chợ
- name: meal
  description: M11 — Lọc cứng, xếp hạng gu, ghép mâm, đổi món, nhận thay thế, dòng lý do
- name: cooking
  description: M12 — Lịch nấu CP-SAT, phiên nấu, nấu xong (UoW), hoàn tác
- name: journal
  description: M13 — Nhật ký tuần (view chỉ đọc)
- name: survey
  description: M14 — Phiếu khảo sát khối không đầy đủ, người tham gia ẩn danh, điểm, món hay ăn
- name: admin
  description: 'M15 — Endpoint/CLI nhân sự: yêu cầu dữ liệu, kiểm toán, nhập kho món, mô hình, khảo sát'
paths:
  /auth/register:
    post:
      operationId: identity_register_user
      tags:
      - identity
      summary: Đăng ký tài khoản
      description: Tạo users (role = user) và trả phiên đăng nhập ngay. Mật khẩu băm Argon2id. Đồng ý theo mục đích được hỏi
        ở bước sau (POST /me/consents), không tích sẵn.
      x-use-cases:
      - UC01
      x-module: M02
      x-idempotency: none
      security: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'Email đã có tài khoản — code: `email_taken`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
        '422':
          description: 'Email sai cú pháp, mật khẩu yếu hoặc thân sai — code: `invalid_email`, `weak_password`, `validation_error`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      operationId: identity_login_user
      tags:
      - identity
      summary: Đăng nhập
      description: Kiểm mật khẩu, tạo refresh token family mới. Sai 5 lần theo (email, IP) → khoá 15 phút (NFR-SEC-02); trong
        thời gian khoá trả 429 login_locked kể cả khi mật khẩu đúng.
      x-use-cases:
      - UC02
      x-module: M02
      x-idempotency: none
      security: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'Sai thông tin đăng nhập — code: `invalid_credentials`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Tài khoản đang chờ xoá — code: `account_deletion_pending`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
        '429':
          description: 'Cặp (email, IP) bị khoá tạm hoặc vượt tần suất — code: `login_locked`, `rate_limited`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '503':
          description: 'Valkey hoặc CSDL chưa sẵn sàng — code: `service_unavailable`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
  /auth/refresh:
    post:
      operationId: identity_refresh_token
      tags:
      - identity
      summary: Làm mới phiên
      description: 'Xoay vòng refresh token: thu hồi token cũ (revoked_at, replaced_by_id), cấp token mới cùng family_id.
        Dùng lại token đã thu hồi → thu hồi cả family, trả 401 refresh_reused (NFR-SEC-01).'
      x-use-cases:
      - UC02
      x-module: M02
      x-idempotency: none
      security: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'Refresh token không dùng được — code: `refresh_invalid`, `refresh_reused`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Tài khoản đang chờ xoá — code: `account_deletion_pending`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: identity_logout_session
      tags:
      - identity
      summary: Đăng xuất thiết bị hiện tại
      description: 'Thu hồi family của refresh token gửi lên. Lũy đẳng: token đã thu hồi vẫn trả 204.'
      x-use-cases:
      - UC03
      x-module: M02
      x-idempotency: idempotent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Đã đăng xuất
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/AppTooOld'
  /auth/logout-all:
    post:
      operationId: identity_logout_all_sessions
      tags:
      - identity
      summary: Đăng xuất mọi thiết bị
      description: Thu hồi mọi refresh token của người dùng và tăng users.token_version để vô hiệu mọi access token đang lưu
        hành. Lũy đẳng.
      x-use-cases:
      - UC03
      x-module: M02
      x-idempotency: idempotent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      responses:
        '204':
          description: Đã đăng xuất mọi thiết bị
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/AppTooOld'
  /auth/password-reset/request:
    post:
      operationId: identity_request_password_reset
      tags:
      - identity
      summary: Yêu cầu đặt lại mật khẩu
      description: Luôn trả 204 dù email có tồn tại hay không (không lộ tài khoản). Nếu có, tạo password_resets (hạn 30 phút)
        và gửi thư qua dịch vụ email (A09). Gửi lại trong thời gian token cũ còn hạn không tạo thư mới.
      x-use-cases:
      - UC04
      x-module: M02
      x-idempotency: idempotent
      security: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Đã nhận yêu cầu
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/AppTooOld'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-reset/confirm:
    post:
      operationId: identity_confirm_password_reset
      tags:
      - identity
      summary: Đặt mật khẩu mới bằng token trong thư
      description: Đặt password_hash mới, ghi used_at, thu hồi mọi refresh token và tăng token_version. Token sai, đã dùng
        hoặc hết hạn → 400 reset_token_invalid; mật khẩu mới không đạt chính sách → 422 weak_password (token chưa bị tiêu).
      x-use-cases:
      - UC04
      x-module: M02
      x-idempotency: none
      security: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Đã đổi mật khẩu
        '400':
          description: 'Token sai, đã dùng hoặc hết hạn; hoặc thân sai — code: `reset_token_invalid`, `validation_error`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
        '422':
          description: 'Mật khẩu mới không đạt chính sách (token chưa bị tiêu) — code: `weak_password`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /policies/{purpose}/current:
    get:
      operationId: privacy_get_current_policy
      tags:
      - privacy
      summary: Lấy điều khoản hiện hành của một mục đích
      description: Trả phiên bản policy_versions có effective_from mới nhất ≤ hiện tại. Dùng ở màn đồng ý khi thiết lập hồ
        sơ (UC09), cài đặt (UC05) và trang khảo sát (UC23).
      x-use-cases:
      - UC05
      - UC09
      - UC23
      x-module: M03
      x-idempotency: idempotent
      security: []
      parameters:
      - $ref: '#/components/parameters/Purpose'
      - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 'Mục đích không tồn tại — code: `purpose_not_found`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
  /me/consents:
    get:
      operationId: privacy_list_consents
      tags:
      - privacy
      summary: Xem trạng thái đồng ý theo từng mục đích
      description: Một dòng cho mỗi mục đích trong consent_purposes, kể cả mục đích chưa từng quyết định (state = none).
      x-use-cases:
      - UC05
      x-module: M03
      x-idempotency: idempotent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/AppTooOld'
    post:
      operationId: privacy_record_consents
      tags:
      - privacy
      summary: Ghi quyết định đồng ý / không đồng ý
      description: 'Ghi thêm consent_events cho từng quyết định. Lũy đẳng: quyết định trùng trạng thái hiện hành không tạo
        sự kiện mới. policy_version_id phải là bản hiện hành của mục đích. Rút đồng ý qua đây có cùng hiệu lực như /withdraw
        (BR-CONSENT-04).'
      x-use-cases:
      - UC05
      - UC09
      x-module: M03
      x-idempotency: idempotent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentDecisionBatch'
      responses:
        '200':
          description: Trạng thái đồng ý sau khi ghi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'policy_version_id không còn là bản hiện hành — code: `policy_outdated`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
        '422':
          description: 'Mục đích không ghi được ở đây (survey) hoặc mã lạ; thân sai — code: `purpose_not_allowed`, `validation_error`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/consents/{purpose}/withdraw:
    post:
      operationId: privacy_withdraw_consent
      tags:
      - privacy
      summary: Rút đồng ý một mục đích
      description: Ghi consent_events action = withdraw, tăng users.token_version (access token cũ hết hiệu lực ngay, app
        gọi /auth/refresh), xếp lịch xoá dữ liệu của mục đích trong ≤ 24 giờ (BR-CONSENT-04). Lũy đẳng.
      x-use-cases:
      - UC05
      x-module: M03
      x-idempotency: idempotent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Purpose'
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentWithdrawRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentWithdrawResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Mục đích không tồn tại — code: `purpose_not_found`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
  /me/data-requests:
    post:
      operationId: privacy_create_data_request
      tags:
      - privacy
      summary: Gửi yêu cầu của chủ thể dữ liệu
      description: 'Ghi dsr_requests (status = received) và đẩy job xử lý. access/export/delete/withdraw tự hoàn tất ≤ 24
        giờ; correct/restrict/object chờ quản trị viên (UC08, UC27). type = delete chuyển users.status = deletion_requested.
        Lũy đẳng: còn yêu cầu cùng type chưa xong thì trả lại yêu cầu đó với 200.'
      x-use-cases:
      - UC06
      - UC07
      - UC08
      x-module: M03
      x-idempotency: idempotent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRequestCreate'
      responses:
        '200':
          description: Đã có yêu cầu cùng loại đang mở; trả lại yêu cầu đó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRequest'
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '202':
          description: Đã nhận, đang xử lý bất đồng bộ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRequest'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Mật khẩu xác nhận sai khi yêu cầu xoá — code: `reauth_failed`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/AppTooOld'
        '422':
          description: 'Loại yêu cầu sai hoặc thiếu ghi chú — code: `invalid_request`, `validation_error`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/data-requests/{id}:
    get:
      operationId: privacy_get_data_request
      tags:
      - privacy
      summary: Theo dõi yêu cầu dữ liệu
      description: Chỉ trả yêu cầu của chính người gọi (lọc user_id).
      x-use-cases:
      - UC06
      - UC07
      - UC08
      x-module: M03
      x-idempotency: idempotent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRequest'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '400':
