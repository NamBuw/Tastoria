          pattern: ^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$
        timezone:
          type: string
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/JournalDay'
        kcal_range_status:
          type: string
          enum:
          - calibrated
          - calibrating
          description: calibrating → app hiện 'đang hiệu chỉnh' (BR-NUT-06)
      required:
      - week
      - timezone
      - days
      - kcal_range_status
