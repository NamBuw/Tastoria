[project]
name = "tastoria-ml"
version = "0.1.0"
description = "Tastoria: source-data pipelines and ML models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
