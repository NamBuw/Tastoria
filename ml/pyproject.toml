[project]
name = "tastoria-ml"
version = "0.1.0"
description = "Tastoria: source-data pipelines and ML models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "implicit>=0.7.2",
    "lightfm-next>=1.19.0",
    "lightgbm>=4.6",
    "gensim>=4.4.0",
    "ortools>=9.12",
    "matplotlib>=3.9",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
