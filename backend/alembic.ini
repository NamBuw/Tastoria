# Alembic for Tastoria. The DB URL comes from TASTORIA_DATABASE_URL (see src/tastoria/migrations/env.py).
# Prefer `uv run --package tastoria-backend tastoria db upgrade`, which uses the same configuration.
[alembic]
script_location = %(here)s/src/tastoria/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
