name: Backend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --package tastoria-backend --group dev
      - run: uv run --no-sync --package tastoria-backend --directory backend lint-imports
      - run: uv run --no-sync --package tastoria-backend --directory backend pytest -q tests/unit

