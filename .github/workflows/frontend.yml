name: Frontend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run typecheck && npm run lint
        working-directory: app
      - run: python3 app/scripts/contrast.py
      - run: npm run export:web
        working-directory: app
      - run: python3 -m pip install playwright==1.58.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Public landing and protected app smoke test
        run: |
          cd app
          PORT=8137 node scripts/serve-web.mjs > /tmp/tastoria-preview.log 2>&1 &
          cd ..
          python3 app/scripts/frontend_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: tastoria-web-${{ github.sha }}
          path: app/dist/
          retention-days: 14
  promote:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Promote tested commit for pull deployment
        env:
          TESTED_SHA: ${{ github.sha }}
        run: git push origin "$TESTED_SHA:refs/heads/deploy/frontend"
