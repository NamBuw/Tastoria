# Isolated Docker Compose override for Tastoria Opaque-Box E2E on 171.226.10.153.
# Never modifies live deploy/.env or live port 6880.
# Usage:
#   COMPOSE_PROJECT_NAME=tastoria_e2e docker compose \
#     -f deploy/docker-compose.yml -f tests/e2e/docker-compose.e2e.yml up -d --build --wait
name: tastoria_e2e

services:
  nginx:
    image: tastoria_e2e-web:e2e
    ports: !override
      - "127.0.0.1:${TASTORIA_E2E_PORT:-16880}:80"

  api:
    image: tastoria_e2e-backend:e2e
    env_file: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}
      TASTORIA_ENV: ${TASTORIA_ENV:-test}
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria:${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
      TASTORIA_JWT_KEYS: '{"e2e-1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
      TASTORIA_JWT_ACTIVE_KID: e2e-1
      TASTORIA_HEALTH_ENC_KEYS: '{"e2e-1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      TASTORIA_HEALTH_ENC_ACTIVE_KEY_ID: e2e-1
      TASTORIA_DSR_HMAC_KEY: tastoria-e2e-dsr-hmac-secret-key
      TASTORIA_RESET_URL_BASE: http://127.0.0.1:${TASTORIA_E2E_PORT:-16880}/dat-lai-mat-khau
      TASTORIA_MAILER: log
      TASTORIA_MAIL_FROM: Tastoria E2E <no-reply@tastoria.local>
      TASTORIA_LOG_LEVEL: INFO
      TASTORIA_MIN_APP_VERSION: ${TASTORIA_MIN_APP_VERSION:-0.1.0}
      TASTORIA_API_WORKERS: ${TASTORIA_API_WORKERS:-2}

  migrate:
    image: tastoria_e2e-backend:e2e
    env_file: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}
      TASTORIA_ENV: ${TASTORIA_ENV:-test}
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria:${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
      TASTORIA_JWT_KEYS: '{"e2e-1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
      TASTORIA_JWT_ACTIVE_KID: e2e-1
      TASTORIA_HEALTH_ENC_KEYS: '{"e2e-1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      TASTORIA_HEALTH_ENC_ACTIVE_KEY_ID: e2e-1
      TASTORIA_DSR_HMAC_KEY: tastoria-e2e-dsr-hmac-secret-key
      TASTORIA_MAILER: log
      TASTORIA_LOG_LEVEL: INFO

  worker:
    image: tastoria_e2e-backend:e2e
    env_file: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}
      TASTORIA_ENV: ${TASTORIA_ENV:-test}
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria:${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
      TASTORIA_JWT_KEYS: '{"e2e-1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
      TASTORIA_JWT_ACTIVE_KID: e2e-1
      TASTORIA_HEALTH_ENC_KEYS: '{"e2e-1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      TASTORIA_HEALTH_ENC_ACTIVE_KEY_ID: e2e-1
      TASTORIA_DSR_HMAC_KEY: tastoria-e2e-dsr-hmac-secret-key
      TASTORIA_LOG_LEVEL: INFO

  scheduler:
    image: tastoria_e2e-backend:e2e
    env_file: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}
      TASTORIA_ENV: ${TASTORIA_ENV:-test}
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria:${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
      TASTORIA_JWT_KEYS: '{"e2e-1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
      TASTORIA_JWT_ACTIVE_KID: e2e-1
      TASTORIA_HEALTH_ENC_KEYS: '{"e2e-1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      TASTORIA_HEALTH_ENC_ACTIVE_KEY_ID: e2e-1
      TASTORIA_DSR_HMAC_KEY: tastoria-e2e-dsr-hmac-secret-key
      TASTORIA_LOG_LEVEL: INFO

  postgres:
    environment:
      POSTGRES_USER: tastoria
      POSTGRES_DB: tastoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tastoria_e2e_pg_pass}

volumes:
  pgdata:
    name: tastoria_e2e_pgdata
  files:
    name: tastoria_e2e_files
  valkeydata:
    name: tastoria_e2e_valkeydata

networks:
  backend:
    name: tastoria_e2e_backend
