[pytest]
testpaths = .
pythonpath = ../..
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    tier1: Tier 1 isolated feature tests across F1-F15 (>= 5 per feature)
    tier2: Tier 2 boundary value analysis and negative/rejection tests across F1-F15 (>= 5 per feature)
    tier3: Tier 3 all-pairs cross-feature combination tests (>= 15 combinations)
    tier4: Tier 4 real-world end-to-end Playwright journeys (Desktop & Mobile, Light & Dark)
    pending_m3_m4: Tests exercising unmerged M1/M2/M3/M4/M5 deliverables (exclude with -m "not pending_m3_m4" on baseline HEAD)
