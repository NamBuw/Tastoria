# Danh sách món nhà Việt cho kho công thức Tastoria (bước 1: danh sách, chưa có định lượng và bước nấu).
#
# Mục đích: chốt 180 món phổ biến của bữa cơm nhà, chia 3 slot của mâm (BR-TRAY-01):
#   man = món mặn (đạm), rau = món rau (xào, luộc, nộm, dưa), canh = món canh.
# Món rau có thịt (đậu que xào thịt, bò xào súp lơ) xếp vào slot rau khi rau chiếm phần lớn khối lượng.
#
# Trường của mỗi món:
#   slug, name_vi       định danh và tên (NFC, không trùng).
#   slot                man | rau | canh.
#   method              mã trong ref/cooking_methods.yaml.
#   main                nguyên liệu chính (định nghĩa món; dùng cho D(m) trùng nguyên liệu chính và bảng lớp thị giác).
#   seasonings          gia vị và rau thơm đặc trưng của món (không đủ hết gia vị nền). Ghi để BR-ALG/BR-DIET
#                       kiểm được cả gia vị (ví dụ nước mắm làm món không còn chay).
#   region              bac | trung | nam | chung (phổ biến cả nước).
#   vegetarian          true khi mọi main + seasonings đều qua chế độ "chay" (ref/diets.yaml).
#                       Validator kiểm cờ này khớp với nhóm thực phẩm của nguyên liệu.
#   minutes             tổng thời gian nấu ƯỚC LƯỢNG (phút, gồm sơ chế, không gồm thời gian ướp qua đêm hay
#                       chờ muối chua). Là ước lượng của nhóm để chọn món; số thật lấy từ recipe_steps khi soạn.
#   seen_in             (nếu có) URL bài viết cùng tên món trên một trang tham khảo bên dưới. Khớp tự động tên món
#                       (có đổi cách gọi vùng: lợn/heo, đậu phụ/đậu hũ...) với 360 tiêu đề ở trang 1–2 của các mục
#                       trong references, lấy ngày 17/10/2026; chỉ đọc tiêu đề, không chép nội dung công thức.
#                       Mẫu tiêu đề nhỏ nên món không có seen_in KHÔNG có nghĩa là không phổ biến; khi soạn công
#                       thức, mỗi món cần ≥ 2 nguồn trong recipe_sources (thiết kế v2 §5).
#
# Căn cứ độ phổ biến (đọc tên món, không chép công thức):
version: 1
