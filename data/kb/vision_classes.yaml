# Bảng lớp thị giác của bộ phát hiện nguyên liệu Tastoria (thiết kế v2 §7, review:cv#4).
#
# Tiêu chí chọn lớp (thiết kế v2 §7):
#   (a) là nguyên liệu chính (trường `main`) của món mặn / rau / canh trong data/kb/dish_list.yaml;
#       gia vị và rau thơm bị loại;
#   (b) thường để ở ngăn mát tủ lạnh (không phải ngăn đá, không phải tủ bếp);
#   (c) tách được bằng mắt trên ảnh chụp tủ lạnh. Điểm (c) mới là giả thuyết: phải kiểm bằng vòng gán thử
#       100–150 ảnh (F1 giữa hai người, κ tên lớp ≥ 0,81). Lớp nào không đạt thì gộp vào nhãn cha
#       (ghi ở `fallback_parent`) hoặc bỏ.
#   Mục tiêu dữ liệu: mỗi lớp ≥ 300 vật thể train, ≥ 30–50 vật thể test (ảnh tủ lạnh của nhóm).
#
# Trường của mỗi lớp:
#   id                  mã lớp (ASCII, cố định; thứ tự trong danh sách = chỉ số lớp YOLO).
#   name_vi, name_en    tên hiển thị trên chip.
#   ingredients         tên name_vi trong data/kb/ingredients.yaml (nhiều–nhiều: một lớp ứng với nhiều
#                       nguyên liệu, người dùng chọn loại cụ thể trên chip; một nguyên liệu có thể nằm ở
#                       nhiều lớp khi trông giống nhau). Test kiểm mọi tên đều có trong ingredients.yaml.
#   dish_main_count     số món trong dish_list.yaml có ít nhất một nguyên liệu của lớp trong `main`
#                       (đếm tự động, test kiểm lại).
#   countable           true khi số khung có nghĩa là số lượng (từng quả, từng bìa). false với bó, túi, khay.
#   instance_def        item (một vật: một quả, một củ, một bắp) | group_of (một bó / một túi / một chùm,
#                       kiểu IsGroupOf của Open Images) | package (một khay, hộp, túi kín có nhãn).
#   instance_note       mô tả một thể hiện để người gán nhãn làm giống nhau.
#   has_freshness_model true khi nằm trong kế hoạch mô hình độ tươi (6–8 loại có thời hạn ngắn, review:cv#1).
#   fridge              ngăn mát | ngăn mát hoặc ngoài: điều kiện (b) và ghi chú khi không chắc.
#   public_data         nguồn công khai đã ánh xạ được vào lớp (khoá nguồn → nhãn gốc). Rỗng nghĩa là lớp
#                       chỉ có thể học từ ảnh nhóm tự chụp (hoặc bộ Roboflow cần API key, chưa tải).
#   pending_public      bộ Roboflow Universe có nhãn phù hợp nhưng cần API key (chưa tải, chưa kiểm ảnh).
#   fallback_parent     nhãn cha để gộp nếu vòng gán thử cho thấy không tách được.
#   reason              lý do chọn.
#
# Nguồn dữ liệu công khai (chi tiết giấy phép ở data/raw/images/<nguồn>/SOURCE.md):
#   openimages_v7       Open Images V7, tập boxable (nhãn CC BY 4.0, ảnh CC BY 2.0 theo từng ảnh).
#   mendeley_bd         Jahan et al. 2025, Vegetable Object Detection Dataset from Bangladesh, Mendeley
#                       gnc4s3z2mf v3 (CC BY 4.0). 3.534 khung hình cắt từ 10 video quầy rau.
# Bộ Roboflow (cần API key, xem docs/reports/xu-ly-anh/ket-qua-so-bo.md): viet_hoang (Viet Hoang Food
#   food-ingredient-detection-mnc5n), robo1 (INGREDIENTS ingredients-b5dkh), smartpantry
#   (ingredients-yot0w), nhan_dien_rau (khai-pha-du-lieu/nhan-dien-rau-p2y8s), water_spinach
#   (fishdetect-q6amf/water-spinach-disease-7a5pr), phcs (phcs-workspace-kultf/vegetables-ckjsc),
#   aicook (aicook-lcv4d, MIT).
