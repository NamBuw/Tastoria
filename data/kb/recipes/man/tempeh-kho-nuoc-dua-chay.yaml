steps:
- step_no: 1
  text_vi: Rửa sạch, sơ chế đậu tương lên men tempeh, nước dừa và cắt miếng vừa ăn; băm nhỏ hành tỏi gia vị.
  kind: active
  minutes: 8
  uses_burner: false
- step_no: 2
  text_vi: Ướp đậu tương lên men tempeh, nước dừa với gia vị cho thấm đều khoảng 10 phút.
  kind: passive
  minutes: 10
  uses_burner: false
- step_no: 3
  text_vi: Xào săn đậu tương lên men tempeh, nước dừa, thêm nước xâm xấp mặt và kho lửa nhỏ liu riu đến khi sệt đậm đà.
  kind: passive
  minutes: 25
  uses_burner: true
