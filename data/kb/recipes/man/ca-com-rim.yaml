slug: ca-com-rim
name_vi: "Cá cơm rim mặn ngọt"
slot: man
servings: 4
method: rim
tags: [dam_da, cay, thom_toi, kho_rao, bua_thuong, com_hop]
ingredients:
  - {name: cá cơm, grams: 400, role: main, note: "cá cơm tươi (cá cơm sữa) nguyên con"}
  - {name: nước mắm, grams: 30, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: đường, grams: 24, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 12 g)"}
  - {name: tỏi, grams: 18, role: seasoning, note: "6 tép (1 tép ≈ 3 g)"}
  - {name: ớt, grams: 10, role: seasoning, note: "2 quả (1 quả ≈ 5 g)"}
  - {name: dầu ăn, grams: 26, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 13 g)"}
  - {name: lạc, grams: 30, role: side, optional: true, note: "lạc rang bóc vỏ, rắc khi gần xong"}
  - {name: hành lá, grams: 15, role: seasoning, optional: true, note: "1 cây"}
steps:
  - {step_no: 1, text_vi: "Rửa nhẹ cá cơm, bỏ đầu và ruột nếu cá to, để thật ráo nước.", kind: active, minutes: 10, uses_burner: false}
  - {step_no: 2, text_vi: "Băm tỏi và ớt; pha nước mắm với đường thành chén nước rim.", kind: active, minutes: 3, uses_burner: false}
  - {step_no: 3, text_vi: "Phi thơm tỏi với dầu, cho cá vào đảo nhẹ đến khi săn và hơi vàng.", kind: active, minutes: 6, uses_burner: true}
  - {step_no: 4, text_vi: "Đổ chén nước rim và ớt vào, để lửa nhỏ cho cá thấm và nước cạn dần.", kind: passive, minutes: 10, uses_burner: true}
  - {step_no: 5, text_vi: "Đảo nhẹ đến khi nước sệt bám đều cá, thêm lạc rang và hành lá rồi tắt bếp.", kind: active, minutes: 3, uses_burner: true}
sources:
  - {url: "https://vnexpress.net/ca-com-sua-rim-dau-phong-4298525.html", title: "Cách làm cá cơm sữa rim đậu phộng đậm đà (VnExpress)", accessed_on: 2026-10-17}
  - {url: "https://fptshop.com.vn/tin-tuc/dien-may/ca-com-sua-rim-dau-phong-169176", title: "Học cách làm cá cơm sữa rim đậu phộng (FPT Shop)", accessed_on: 2026-10-17}
  - {url: "https://vnexpress.net/ca-com-kho-rim-toi-ot-4581266.html", title: "Cách làm cá cơm khô rim tỏi ớt (VnExpress)", accessed_on: 2026-10-17}
notes: "Dùng cá cơm tươi để khớp nguyên liệu cá cơm. Hai nguồn cá cơm sữa chỉ ghi gia vị theo khẩu vị (150 g cá); tỉ lệ nước mắm : đường 1 : 1 lấy theo các công thức cá cơm khô rim, giảm lượng cho cá tươi. Lượng cá 400 g là ước lượng cho món chính 4 người."
