slug: cha-la-lot
name_vi: "Chả lá lốt"
slot: man
servings: 4
method: chien
tags: [dam_da, beo, kho_rao, bua_thuong, com_hop]
ingredients:
  - {name: thịt băm, grams: 400, role: main, note: "Nên có chút mỡ cho chả không khô"}
  - {name: lá lốt, grams: 100, role: main, note: "1 bó (≈ 30 lá)"}
  - {name: hành tím, grams: 20, role: seasoning, note: "2 củ (1 củ ≈ 10 g)"}
  - {name: tỏi, grams: 6, role: seasoning, note: "2 tép (1 tép ≈ 3 g)"}
  - {name: nước mắm, grams: 15, role: seasoning, note: "1 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: tiêu, grams: 2.5, role: seasoning, note: "1 muỗng cà phê tiêu xay"}
  - {name: đường, grams: 4, role: seasoning, note: "1 muỗng cà phê"}
  - {name: hạt nêm, grams: 4, role: seasoning, note: "1 muỗng cà phê"}
  - {name: dầu ăn, grams: 39, role: seasoning, note: "3 muỗng canh rán áp chảo (1 muỗng canh ≈ 13 g)"}
steps:
  - {step_no: 1, text_vi: "Rửa lá lốt, để thật ráo; chọn lá to để cuốn, thái nhỏ vài lá nhỏ để trộn nhân.", kind: active, minutes: 8, uses_burner: false}
  - {step_no: 2, text_vi: "Băm hành tím, tỏi; trộn thịt với hành tỏi, lá lốt thái, nước mắm, đường, hạt nêm và tiêu.", kind: active, minutes: 4, uses_burner: false}
  - {step_no: 3, text_vi: "Để nhân ngấm gia vị.", kind: passive, minutes: 15, uses_burner: false}
  - {step_no: 4, text_vi: "Đặt một thìa nhân lên mặt trái lá, cuốn chặt tay, xếp mép lá nằm dưới.", kind: active, minutes: 15, uses_burner: false}
  - {step_no: 5, text_vi: "Rán chả trong chảo ít dầu ở lửa vừa, lật một lần, đến khi hai mặt vàng sém.", kind: active, minutes: 10, uses_burner: true}
sources:
  - {url: "https://hoanghamobile.com/tin-tuc/cach-lam-cha-la-lot/", title: "Cách làm chả lá lốt thơm ngon, cuốn đẹp không bị bung (Hoàng Hà Mobile)", accessed_on: 2026-10-17}
  - {url: "https://fptshop.com.vn/tin-tuc/dien-may/cach-lam-cha-la-lot-162760", title: "Hướng dẫn cách làm chả lá lốt thịt heo thơm ngon, không bị khô (FPT Shop)", accessed_on: 2026-10-17}
  - {url: "https://monngonmoingay.com/cha-thit-la-lot/", title: "Chả thịt lá lốt (Món Ngon Mỗi Ngày)", accessed_on: 2026-10-17}
notes: "Nguồn dùng 300–400 g thịt và 20–30 lá. Rán áp chảo bằng ít dầu, không chiên ngập."
