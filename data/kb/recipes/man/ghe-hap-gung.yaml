slug: ghe-hap-gung
name_vi: "Ghẹ hấp gừng"
slot: man
servings: 4
method: hap
tags: [thanh, thom_sa_gung, cuoi_tuan, troi_nong]
ingredients:
  - {name: ghẹ, grams: 1000, role: main, note: "khoảng 5 con sống (1 con ≈ 200 g), tính cả vỏ"}
  - {name: gừng, grams: 30, role: seasoning, note: "1 nhánh (≈ 30 g), thái lát"}
  - {name: sả, grams: 100, role: seasoning, note: "4 cây (1 cây ≈ 25 g), đập dập cắt khúc"}
  - {name: muối, grams: 6, role: seasoning, note: "1 muỗng cà phê (≈ 6 g), pha muối tiêu chanh"}
  - {name: chanh, grams: 50, role: seasoning, note: "1 quả"}
  - {name: tiêu, grams: 2.5, role: seasoning, optional: true, note: "1 muỗng cà phê tiêu xay (≈ 2,5 g)"}
  - {name: ớt, grams: 5, role: seasoning, optional: true, note: "1 quả"}
steps:
  - {step_no: 1, text_vi: "Dùng bàn chải chà sạch mai và yếm ghẹ dưới vòi nước, để ráo.", kind: active, minutes: 8, uses_burner: false}
  - {step_no: 2, text_vi: "Đun sôi nồi nước hấp; lót sả và gừng trên xửng rồi xếp ghẹ ngửa yếm lên.", kind: active, minutes: 3, uses_burner: true}
  - {step_no: 3, text_vi: "Đậy nắp hấp lửa lớn đến khi ghẹ đỏ cam và dậy mùi gừng sả.", kind: passive, minutes: 15, uses_burner: true}
  - {step_no: 4, text_vi: "Trong lúc hấp, trộn muối, tiêu, ớt và vắt chanh làm chén chấm.", kind: active, minutes: 2, uses_burner: false}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-lam-ghe-hap-sa-va-gung-nguyen-con-thom-bung-vi-giac-voi-23113", title: "Cách làm ghẹ hấp sả và gừng nguyên con (Điện Máy XANH)", accessed_on: 2026-10-17}
  - {url: "https://www.bachhoaxanh.com/kinh-nghiem-hay/hap-ghe-bao-nhieu-phut-chin-cach-hap-ghe-ngon-chac-thit-va-khong-tanh-6592854", title: "Hấp ghẹ bao nhiêu phút chín? Cách hấp ghẹ ngon (Bách hóa XANH)", accessed_on: 2026-10-17}
  - {url: "https://www.bachhoaxanh.com/kinh-nghiem-hay/4-cach-hap-ghe-ngon-don-gian-voi-nguyen-lieu-co-san-1236612", title: "4 cách hấp ghẹ ngon đơn giản (Bách hóa XANH)", accessed_on: 2026-10-17}
notes: "Nguồn dùng 1 kg ghẹ cho 2–3 người, hấp 15–18 phút/kg; ở đây 1 kg cho 4 người ăn cùng mâm cơm. Muối và chanh dùng cho chén chấm muối tiêu chanh."
