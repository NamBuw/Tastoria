steps:
- step_no: 1
  text_vi: Rửa sạch, sơ chế chân giò, hạt sen, cà rốt và cắt miếng vừa ăn; băm nhỏ hành tỏi gia vị.
  kind: active
  minutes: 8
  uses_burner: false
- step_no: 2
  text_vi: Chần sơ và đảo săn chân giò, hạt sen, cà rốt, đổ ngập nước đun sôi rồi hớt bọt.
  kind: active
  minutes: 8
  uses_burner: true
- step_no: 3
  text_vi: Hầm nhỏ lửa cùng nguyên liệu phụ đến khi chín mềm, nêm lại vừa miệng.
  kind: passive
  minutes: 40
  uses_burner: true
