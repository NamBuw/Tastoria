slug: tom-hap-sa
name_vi: "Tôm hấp sả"
slot: man
servings: 4
method: hap
tags: [thanh, thom_sa_gung, nau_nhanh, troi_nong, bua_thuong]
ingredients:
  - {name: tôm, grams: 500, role: main, note: "tôm tươi còn vỏ"}
  - {name: sả, grams: 100, role: seasoning, note: "4 cây (1 cây ≈ 25 g), đập dập cắt khúc"}
  - {name: muối, grams: 6, role: seasoning, note: "1 muỗng cà phê (≈ 6 g), một nửa ướp tôm, một nửa pha muối tiêu chanh"}
  - {name: tiêu, grams: 2.5, role: seasoning, note: "1 muỗng cà phê tiêu xay (≈ 2,5 g)"}
  - {name: chanh, grams: 50, role: seasoning, note: "1 quả, vắt pha muối tiêu chấm"}
  - {name: ớt, grams: 5, role: seasoning, optional: true, note: "1 quả"}
  - {name: gừng, grams: 15, role: seasoning, optional: true, note: "1/2 nhánh (1 nhánh ≈ 30 g), thái lát"}
steps:
  - {step_no: 1, text_vi: "Rửa tôm qua nước muối loãng, cắt râu, bỏ chỉ đen rồi trộn với chút muối và tiêu.", kind: active, minutes: 6, uses_burner: false}
  - {step_no: 2, text_vi: "Đun sôi nồi nước hấp, lót sả (và gừng) dưới xửng rồi xếp tôm lên trên.", kind: active, minutes: 3, uses_burner: true}
  - {step_no: 3, text_vi: "Đậy nắp hấp lửa lớn đến khi tôm đỏ đều, thịt vừa chín.", kind: passive, minutes: 8, uses_burner: true}
  - {step_no: 4, text_vi: "Trong lúc chờ, pha muối với tiêu, vắt chanh, thêm ớt làm chén chấm.", kind: active, minutes: 2, uses_burner: false}
sources:
  - {url: "https://fptshop.com.vn/tin-tuc/dien-may/tom-hap-sa-178077", title: "Cách làm tôm hấp sả thơm lừng, ngon ngọt tự nhiên tại nhà (FPT Shop)", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-hap-tom-sa-gung-giu-nguyen-duong-chat-thom-lung-cuon-hut-23439", title: "Cách hấp tôm sả gừng giữ nguyên dưỡng chất (Điện Máy XANH)", accessed_on: 2026-10-17}
notes: "Nguồn ướp tôm 5–10 phút; gộp vào bước sơ chế (trong lúc đun nước) nên không có bước ướp riêng. Một số nguồn thay nước hấp bằng bia; không tính vào nguyên liệu."
