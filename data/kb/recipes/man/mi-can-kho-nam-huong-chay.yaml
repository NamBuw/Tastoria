steps:
- step_no: 1
  text_vi: Rửa sạch, sơ chế mì căn, nấm hương tươi và cắt miếng vừa ăn; băm nhỏ hành tỏi gia vị.
  kind: active
  minutes: 8
  uses_burner: false
- step_no: 2
  text_vi: Ướp mì căn, nấm hương tươi với gia vị cho thấm đều khoảng 10 phút.
  kind: passive
  minutes: 10
  uses_burner: false
- step_no: 3
  text_vi: Xào săn mì căn, nấm hương tươi, thêm nước xâm xấp mặt và kho lửa nhỏ liu riu đến khi sệt đậm đà.
  kind: passive
  minutes: 25
  uses_burner: true
