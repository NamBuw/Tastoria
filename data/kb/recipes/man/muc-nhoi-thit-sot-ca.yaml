slug: muc-nhoi-thit-sot-ca
name_vi: "Mực nhồi thịt sốt cà chua"
slot: man
servings: 4
method: om
tags: [dam_da, chua_ngot, sot_sanh, cuoi_tuan, com_hop]
ingredients:
  - {name: mực, grams: 600, role: main, note: "mực ống cỡ vừa, khoảng 3 con (1 con ≈ 200 g)"}
  - {name: thịt băm, grams: 250, role: main}
  - {name: cà chua, grams: 240, role: main, note: "2 quả (1 quả ≈ 120 g)"}
  - {name: mộc nhĩ, grams: 10, role: main, note: "mộc nhĩ khô, ngâm nở rồi băm"}
  - {name: miến, grams: 20, role: side, optional: true, note: "ngâm mềm, cắt ngắn trộn vào nhân"}
  - {name: hành tím, grams: 30, role: seasoning, note: "3 củ (1 củ ≈ 10 g)"}
  - {name: tỏi, grams: 9, role: seasoning, note: "3 tép (1 tép ≈ 3 g)"}
  - {name: nước mắm, grams: 30, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 15 g), chia cho nhân và sốt"}
  - {name: tiêu, grams: 2.5, role: seasoning, note: "1 muỗng cà phê tiêu xay (≈ 2,5 g)"}
  - {name: đường, grams: 12, role: seasoning, note: "1 muỗng canh (≈ 12 g)"}
  - {name: tương cà, grams: 17, role: seasoning, note: "1 muỗng canh (≈ 17 g)"}
  - {name: hạt nêm, grams: 4, role: seasoning, note: "1 muỗng cà phê (≈ 4 g)"}
  - {name: hành lá, grams: 30, role: seasoning, note: "2 cây (1 cây ≈ 15 g)"}
  - {name: dầu ăn, grams: 26, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 13 g), chiên mực và xào sốt"}
steps:
  - {step_no: 1, text_vi: "Ngâm mộc nhĩ (và miến) trong nước ấm cho nở mềm.", kind: passive, minutes: 15, uses_burner: false}
  - {step_no: 2, text_vi: "Làm sạch mực, rút đầu và túi mực, rửa với nước muối pha giấm rồi để ráo.", kind: active, minutes: 10, uses_burner: false}
  - {step_no: 3, text_vi: "Băm đầu mực, mộc nhĩ, hành tím; trộn với thịt băm, hạt nêm, tiêu, một ít nước mắm, nhồi vào thân mực và ghim miệng bằng tăm.", kind: active, minutes: 12, uses_burner: false}
  - {step_no: 4, text_vi: "Chiên mực với ít dầu ở lửa vừa, lật đều đến khi vàng các mặt rồi gắp ra.", kind: active, minutes: 8, uses_burner: true}
  - {step_no: 5, text_vi: "Phi tỏi, cho cà chua thái hạt lựu vào xào nhuyễn, nêm nước mắm, đường, tương cà và ít nước.", kind: active, minutes: 4, uses_burner: true}
  - {step_no: 6, text_vi: "Thả mực vào sốt, đậy nắp om nhỏ lửa cho nhân chín và sốt sánh lại.", kind: passive, minutes: 12, uses_burner: true}
  - {step_no: 7, text_vi: "Cắt mực thành khoanh, rưới sốt và rắc hành lá.", kind: active, minutes: 3, uses_burner: false}
sources:
  - {url: "https://www.bachhoaxanh.com/kinh-nghiem-hay/cach-lam-muc-nhoi-thit-hap-mem-ngon-an-la-mem-lien-1221725", title: "7 cách làm mực nhồi thịt mềm ngon cực hấp dẫn cho bữa cơm nhà (Bách hóa XANH)", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-lam-muc-nhoi-thit-chien-sot-ca-chua-dam-da-doi-vi-cho-08835", title: "Cách làm mực nhồi thịt chiên sốt cà chua đậm đà (Điện Máy XANH)", accessed_on: 2026-10-17}
notes: "Nguồn dùng 500–600 g mực, 200–300 g thịt xay, 2 quả cà chua cho 4 người. Một nguồn ghi 100 g nấm mèo khô (quá nhiều so với nhân); chọn 10 g mộc nhĩ khô. Tổng 64 phút so với ước lượng 50 phút."
