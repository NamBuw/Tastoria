steps:
- step_no: 1
  text_vi: Rửa sạch, sơ chế rươi, trứng gà, thịt băm và cắt miếng vừa ăn; băm nhỏ hành tỏi gia vị.
  kind: active
  minutes: 8
  uses_burner: false
- step_no: 2
  text_vi: Làm nóng chảo với lượng dầu vừa phải, chiên rươi, trứng gà, thịt băm vàng đều các mặt, vớt ráo dầu và dọn kèm gia vị chấm.
  kind: active
  minutes: 10
  uses_burner: true
