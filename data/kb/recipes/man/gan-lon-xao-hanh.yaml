slug: gan-lon-xao-hanh
name_vi: "Gan lợn xào hành"
slot: man
servings: 4
method: xao
tags: [dam_da, thom_toi, mem, nau_nhanh, bua_thuong]
ingredients:
  - {name: gan lợn, grams: 400, role: main}
  - {name: hành tây, grams: 220, role: main, note: "2 củ (1 củ ≈ 110 g)"}
  - {name: hành lá, grams: 45, role: seasoning, note: "3 cây (1 cây ≈ 15 g)"}
  - {name: tỏi, grams: 9, role: seasoning, note: "3 tép (1 tép ≈ 3 g)"}
  - {name: nước mắm, grams: 15, role: seasoning, note: "1 muỗng canh (≈ 15 g)"}
  - {name: tiêu, grams: 2.5, role: seasoning, note: "1 muỗng cà phê tiêu xay (≈ 2,5 g)"}
  - {name: dầu ăn, grams: 26, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 13 g)"}
steps:
  - {step_no: 1, text_vi: "Rửa gan, bỏ gân, thái lát mỏng rồi trộn với nước mắm, tiêu và một nửa tỏi băm.", kind: active, minutes: 8, uses_burner: false}
  - {step_no: 2, text_vi: "Bóc hành tây cắt múi cau, hành lá cắt khúc.", kind: active, minutes: 4, uses_burner: false}
  - {step_no: 3, text_vi: "Phi phần tỏi còn lại, cho gan vào đảo nhanh trên lửa lớn đến khi vừa đổi màu.", kind: active, minutes: 3, uses_burner: true}
  - {step_no: 4, text_vi: "Thêm hành tây, hành lá, đảo đến khi hành vừa chín tới, nêm lại rồi tắt bếp.", kind: active, minutes: 3, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/2-cach-lam-gan-lon-gan-heo-xao-vua-ngon-vua-bo-ai-cung-me-01544", title: "2 cách làm gan lợn (gan heo) xào vừa ngon vừa bổ (Điện Máy XANH)", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/tong-hop-16-cach-lam-cac-mon-xao-hanh-tay-thom-ngon-don-gian-16468", title: "Tổng hợp 16 cách làm các món xào hành tây (Điện Máy XANH)", accessed_on: 2026-10-17}
notes: "ĐMX dùng 300 g gan cho 3 người, nêm xì dầu; ở đây nêm nước mắm theo dish_list và tăng lên 400 g cho 4 người. Xào lửa lớn, nhanh tay để gan không bị bở."
