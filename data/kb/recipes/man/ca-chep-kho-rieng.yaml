  text_vi: Ướp cá chép, thịt ba chỉ với gia vị cho thấm đều khoảng 10 phút.
  kind: passive
  minutes: 10
  uses_burner: false
- step_no: 3
  text_vi: Xào săn cá chép, thịt ba chỉ, thêm nước xâm xấp mặt và kho lửa nhỏ liu riu đến khi sệt đậm đà.
  kind: passive
