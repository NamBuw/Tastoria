slug: cha-gio-chay
name_vi: "Chả giò chay"
slot: man
servings: 4
method: chien
tags: [gion, beo, cuoi_tuan]
ingredients:
  - {name: bánh đa nem, grams: 200, role: main, note: "1 gói (≈ 200 g), khoảng 25–30 lá"}
  - {name: khoai môn, grams: 300, role: main, note: "1 củ (1 củ ≈ 300 g)"}
  - {name: cà rốt, grams: 150, role: main, note: "1,5 củ (1 củ ≈ 100 g)"}
  - {name: mộc nhĩ, grams: 20, role: main, note: "mộc nhĩ khô, ngâm nở"}
  - {name: miến, grams: 50, role: main, note: "1/2 gói (1 gói ≈ 100 g)"}
  - {name: đậu phụ, grams: 150, role: main, note: "1 miếng (1 miếng ≈ 150 g)"}
  - {name: củ đậu, grams: 150, role: side, optional: true, note: "khoảng 1/3 củ (1 củ ≈ 400 g)"}
  - {name: muối, grams: 3, role: seasoning, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 6 g)"}
  - {name: tiêu, grams: 2.5, role: seasoning, note: "1 muỗng cà phê tiêu xay (1 muỗng cà phê ≈ 2,5 g)"}
  - {name: hạt nêm chay, grams: 8, role: seasoning, note: "2 muỗng cà phê (1 muỗng cà phê ≈ 4 g)"}
  - {name: đường, grams: 4, role: seasoning, optional: true, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 4 g)"}
  - {name: dầu ăn, grams: 400, role: seasoning, note: "khoảng 450 ml cho vào chảo để chiên ngập"}
steps:
  - {step_no: 1, text_vi: "Ngâm mộc nhĩ và miến trong nước ấm cho nở mềm.", kind: passive, minutes: 15, uses_burner: false}
  - {step_no: 2, text_vi: "Gọt và bào sợi khoai môn, cà rốt, củ đậu; thái nhỏ mộc nhĩ, cắt ngắn miến, bóp vụn đậu phụ.", kind: active, minutes: 15, uses_burner: false}
  - {step_no: 3, text_vi: "Trộn đều nhân với muối, tiêu, đường và hạt nêm chay.", kind: active, minutes: 3, uses_burner: false}
  - {step_no: 4, text_vi: "Trải lá bánh đa nem, cho nhân vào rồi cuộn chặt tay, gấp kín hai đầu.", kind: active, minutes: 20, uses_burner: false}
  - {step_no: 5, text_vi: "Chiên chả giò ngập dầu ở lửa vừa, trở đều đến khi vàng giòn rồi vớt ra để ráo.", kind: active, minutes: 15, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-lam-cha-gio-chay-khoai-mon-dau-xanh-thanh-tinh-an-hoai-23679", title: "Cách làm chả giò chay khoai môn đậu xanh thanh tịnh ăn hoài không chán (Điện Máy XANH)", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-lam-mon-nem-chay-cho-mam-co-ngay-tet-00451", title: "Cách làm nem rán chay - chả giò chay giòn tan ngon khó cưỡng (Điện Máy XANH)", accessed_on: 2026-10-17}
notes: "Chiên ngập dầu: phần lớn dầu còn lại; dinh dưỡng dùng hệ số hấp thu chất béo (BR-NUT-05). Món chay: không trứng, không nước mắm; nêm bằng muối và hạt nêm chay. Nguồn dùng 400 g khoai môn, 200 g cà rốt, 50 g miến cho 4–6 người; lượng ở đây hạ xuống cho 4 người. Tổng 68 phút so với 50 phút trong dish_list, nhưng bước ngâm (15 phút) chạy song song với việc khác."
