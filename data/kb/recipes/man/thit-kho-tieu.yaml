slug: thit-kho-tieu
name_vi: "Thịt kho tiêu"
slot: man
servings: 4
method: kho
tags: [dam_da, cay, kho_rao, bua_thuong, com_hop]
ingredients:
  - {name: thịt ba chỉ, grams: 500, role: main}
  - {name: hành tím, grams: 20, role: seasoning, note: "2 củ (1 củ ≈ 10 g)"}
  - {name: tỏi, grams: 9, role: seasoning, note: "3 tép (1 tép ≈ 3 g)"}
  - {name: ớt, grams: 5, role: seasoning, optional: true, note: "1 quả"}
  - {name: nước mắm, grams: 30, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: đường, grams: 24, role: seasoning, note: "2 muỗng canh, một nửa thắng nước màu (1 muỗng canh ≈ 12 g)"}
  - {name: tiêu, grams: 6, role: seasoning, note: "1 muỗng canh tiêu hạt đập dập + 1/2 muỗng cà phê tiêu xay (≈ 6 g)"}
  - {name: dầu ăn, grams: 10, role: seasoning, note: "2 muỗng cà phê (1 muỗng cà phê ≈ 5 g)"}
steps:
  - {step_no: 1, text_vi: "Rửa thịt với nước muối loãng, chần sôi 2 phút rồi xả lại và cắt miếng dày khoảng 1,5 cm.", kind: active, minutes: 8, uses_burner: true}
  - {step_no: 2, text_vi: "Băm hành tím, tỏi; ướp thịt với nước mắm, một nửa số đường, tiêu và hành tỏi băm.", kind: active, minutes: 5, uses_burner: false}
  - {step_no: 3, text_vi: "Để thịt ngấm gia vị.", kind: passive, minutes: 20, uses_burner: false}
  - {step_no: 4, text_vi: "Thắng phần đường còn lại với dầu ăn đến màu cánh gián, cho thịt vào đảo săn cạnh.", kind: active, minutes: 5, uses_burner: true}
  - {step_no: 5, text_vi: "Thêm nước xâm xấp mặt thịt, đun nhỏ lửa đến khi thịt mềm và nước kho cạn sánh.", kind: passive, minutes: 30, uses_burner: true}
  - {step_no: 6, text_vi: "Nêm lại, rắc thêm tiêu và ớt cắt lát rồi tắt bếp.", kind: active, minutes: 2, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/3-cach-lam-thit-kho-tieu-thom-ngon-dam-da-de-lam-cho-bua-com-08087", title: "3 cách làm thịt kho tiêu thơm ngon đậm đà dễ làm cho bữa cơm (Điện Máy XANH)", accessed_on: 2026-10-17}
  - {url: "https://vnexpress.net/thit-kho-tieu-kieu-nam-bo-4588250.html", title: "Thịt kho tiêu kiểu Nam Bộ (VnExpress)", accessed_on: 2026-10-17}
  - {url: "https://fptshop.com.vn/tin-tuc/dien-may/thit-kho-tieu-162725", title: "Cách làm thịt kho tiêu đậm đà (FPT Shop)", accessed_on: 2026-10-17}
notes: "Nước dùng để kho/luộc không ghi thành nguyên liệu. Nguồn dùng 300–500 g ba chỉ; chọn 500 g cho 4 người."
