- step_no: 2
  text_vi: Chần sơ và đảo săn thịt vai bò chuck, khoai tây, cà rốt, đổ ngập nước đun sôi rồi hớt bọt.
  kind: active
  minutes: 8
  uses_burner: true
- step_no: 3
  text_vi: Hầm nhỏ lửa cùng nguyên liệu phụ đến khi chín mềm, nêm lại vừa miệng.
