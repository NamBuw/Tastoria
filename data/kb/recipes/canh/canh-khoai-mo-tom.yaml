slug: canh-khoai-mo-tom
name_vi: "Canh khoai mỡ nấu tôm"
slot: canh
servings: 4
method: nau_canh
tags: [beo, mem, nhieu_nuoc, bua_thuong]
ingredients:
  - {name: "khoai mỡ", grams: 500, role: main}
  - {name: "tôm", grams: 200, role: main}
  - {name: "hành tím", grams: 20, role: seasoning, note: "2 củ (1 củ ≈ 10 g)"}
  - {name: "nước mắm", grams: 22.5, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: "dầu ăn", grams: 4.7, role: seasoning, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 4.7 g)"}
  - {name: "tiêu", grams: 0.6, role: seasoning, note: "1/4 muỗng cà phê (1 muỗng cà phê ≈ 2.3 g)"}
  - {name: "rau ngổ", grams: 10, role: seasoning}
  - {name: "ngò gai", grams: 10, role: seasoning}
steps:
  - {step_no: 1, text_vi: "Gọt vỏ khoai mỡ (đeo găng), rửa sạch nhớt, nạo hoặc cắt miếng nhỏ; nhặt rau ngổ, ngò gai.", kind: active, minutes: 10, uses_burner: false}
  - {step_no: 2, text_vi: "Bóc vỏ, rút chỉ tôm, băm hoặc giã dập; ướp với hành tím băm, tiêu và một ít nước mắm.", kind: active, minutes: 6, uses_burner: false}
  - {step_no: 3, text_vi: "Phi hành, xào tôm đến khi đỏ và thơm, đổ nước vào đun sôi.", kind: active, minutes: 5, uses_burner: true}
  - {step_no: 4, text_vi: "Cho rau củ vào, nêm nước mắm.", kind: active, minutes: 2, uses_burner: true}
  - {step_no: 5, text_vi: "Nấu lửa vừa đến khi rau củ chín mềm.", kind: passive, minutes: 10, uses_burner: true}
  - {step_no: 6, text_vi: "Nêm lại, cho hành lá hoặc rau thơm rồi tắt bếp.", kind: active, minutes: 1, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-nau-canh-khoai-mo-tom-tuoi-ngot-mat-hap-dan-cho-bua-com-11670", title: "Cách nấu canh khoai mỡ tôm tươi ngọt mát hấp dẫn cho bữa cơm", accessed_on: 2026-10-17}
  - {url: "https://fptshop.com.vn/tin-tuc/dien-may/canh-khoai-mo-nau-tom-165959", title: "Chế biến canh khoai mỡ nấu tôm ngon đúng điệu, ăn là ghiền cho bữa cơm gia đình", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/2-cach-nau-canh-khoai-mo-tom-kho-va-suon-heo-ngon-mieng-don-09307", title: "2 cách nấu canh khoai mỡ tôm khô và sườn heo ngon miệng (Điện Máy XANH)", accessed_on: 2026-10-17}
notes: "Nước nấu canh (khoảng 1–1,5 lít cho 4 người) không ghi thành nguyên liệu. Khoai mỡ nạo cho canh sánh; cắt miếng thì nấu lâu hơn chút."
