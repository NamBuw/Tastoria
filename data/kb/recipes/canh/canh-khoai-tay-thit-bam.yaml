slug: canh-khoai-tay-thit-bam
name_vi: "Canh khoai tây thịt băm"
slot: canh
servings: 4
method: nau_canh
tags: [thanh, mem, nhieu_nuoc, bua_thuong]
ingredients:
  - {name: "khoai tây", grams: 400, role: main, note: "2 củ (1 củ ≈ 200 g)"}
  - {name: "thịt băm", grams: 150, role: main}
  - {name: "hành tím", grams: 20, role: seasoning, note: "2 củ (1 củ ≈ 10 g)"}
  - {name: "nước mắm", grams: 22.5, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: "tiêu", grams: 0.6, role: seasoning, note: "1/4 muỗng cà phê (1 muỗng cà phê ≈ 2.3 g)"}
  - {name: "dầu ăn", grams: 4.7, role: seasoning, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 4.7 g)"}
  - {name: "cà rốt", grams: 100, role: main, note: "1 củ (1 củ ≈ 100 g)"}
  - {name: "hành lá", grams: 30, role: seasoning, note: "2 cây (1 cây ≈ 15 g)"}
steps:
  - {step_no: 1, text_vi: "Gọt khoai tây và cà rốt, cắt hạt lựu; thái hành lá.", kind: active, minutes: 8, uses_burner: false}
  - {step_no: 2, text_vi: "Ướp thịt băm với hành tím băm, tiêu và một ít nước mắm.", kind: active, minutes: 3, uses_burner: false}
  - {step_no: 3, text_vi: "Phi thơm hành, cho thịt vào xào tơi rồi đổ nước, đun sôi và hớt bọt.", kind: active, minutes: 5, uses_burner: true}
  - {step_no: 4, text_vi: "Thả rau củ vào, nêm phần nước mắm còn lại.", kind: active, minutes: 2, uses_burner: true}
  - {step_no: 5, text_vi: "Nấu lửa vừa đến khi rau củ chín mềm.", kind: passive, minutes: 12, uses_burner: true}
  - {step_no: 6, text_vi: "Nêm lại, cho hành lá rồi tắt bếp.", kind: active, minutes: 1, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-nau-canh-khoai-tay-ca-rot-thit-bam-ngon-ngot-day-dinh-11591", title: "Cách nấu canh khoai tây cà rốt thịt băm đầy dinh dưỡng đơn giản tại nhà", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/3-cach-nau-canh-khoai-tay-don-gian-thom-ngon-ai-an-cung-thich-07903", title: "3 cách nấu canh khoai tây đơn giản thơm ngon ai ăn cũng thích", accessed_on: 2026-10-17}
  - {url: "https://baonghean.vn/en/cac-lam-canh-vien-khoai-tay-ngon-la-mieng-ai-an-cung-me-10304330.html", title: "Cách làm canh viên khoai tây ngon lạ miệng (Báo Nghệ An)", accessed_on: 2026-10-17}
notes: "Nước nấu canh (khoảng 1–1,5 lít cho 4 người) không ghi thành nguyên liệu."
