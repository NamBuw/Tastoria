slug: canh-muop-nau-tom
name_vi: "Canh mướp nấu tôm"
slot: canh
servings: 4
method: nau_canh
tags: [thanh, nhieu_nuoc, troi_nong, bua_thuong]
ingredients:
  - {name: "mướp", grams: 600, role: main, note: "2 quả (1 quả ≈ 300 g)"}
  - {name: "tôm", grams: 200, role: main}
  - {name: "hành tím", grams: 20, role: seasoning, note: "2 củ (1 củ ≈ 10 g)"}
  - {name: "nước mắm", grams: 22.5, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: "dầu ăn", grams: 4.7, role: seasoning, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 4.7 g)"}
  - {name: "tiêu", grams: 0.6, role: seasoning, note: "1/4 muỗng cà phê (1 muỗng cà phê ≈ 2.3 g)"}
  - {name: "hành lá", grams: 30, role: seasoning, note: "2 cây (1 cây ≈ 15 g)"}
steps:
  - {step_no: 1, text_vi: "Gọt mướp, cắt miếng vừa; thái hành lá.", kind: active, minutes: 6, uses_burner: false}
  - {step_no: 2, text_vi: "Bóc vỏ, rút chỉ tôm, băm hoặc giã dập; ướp với hành tím băm, tiêu và một ít nước mắm.", kind: active, minutes: 6, uses_burner: false}
  - {step_no: 3, text_vi: "Phi hành, xào tôm đến khi đỏ và thơm, đổ nước vào đun sôi.", kind: active, minutes: 5, uses_burner: true}
  - {step_no: 4, text_vi: "Cho rau củ vào, nêm nước mắm, nấu đến khi chín tới; thêm hành lá rồi tắt bếp.", kind: active, minutes: 4, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/2-cach-nau-canh-muop-nau-tom-kho-va-tom-tuoi-thom-ngon-don-05919", title: "2 cách nấu canh mướp nấu tôm khô và tôm tươi thơm ngon, đơn giản tại nhà", accessed_on: 2026-10-17}
  - {url: "https://fptshop.com.vn/tin-tuc/dien-may/canh-muop-tom-167909", title: "Lưu ngay 2 cách nấu canh mướp tôm thanh mát, bổ dưỡng để có món canh ngon ngọt đậm đà", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-nau-canh-muop-rau-day-nau-tom-kho-ngot-nuoc-cho-gia-dinh-11947", title: "Cách nấu canh mướp rau đay nấu tôm khô ngọt nước cho gia đình (Điện Máy XANH)", accessed_on: 2026-10-17}
notes: "Nước nấu canh (khoảng 1–1,5 lít cho 4 người) không ghi thành nguyên liệu."
