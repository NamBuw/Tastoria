steps:
- step_no: 1
  text_vi: Rửa sạch, sơ chế cá basa, dọc mùng, cà chua cùng giá đỗ, đậu bắp và cắt miếng vừa ăn; băm nhỏ hành tỏi gia vị.
  kind: active
  minutes: 8
  uses_burner: false
- step_no: 2
  text_vi: Đun sôi khoảng 1,2 lít nước (hoặc xào sơ cá basa, dọc mùng, cà chua), hớt bọt cho nước trong.
  kind: active
  minutes: 6
  uses_burner: true
- step_no: 3
  text_vi: Cho phần rau củ còn lại cùng giá đỗ, đậu bắp vào nấu chín tới, nêm gia vị vừa ăn và rắc rau thơm.
  kind: active
  minutes: 6
  uses_burner: true
