  - {url: "https://mytour.vn/vi/blog/bai-viet/tong-hop-8-mon-ngon-tu-xa-lach-xoong-dinh-duong-de-lam.html", title: "Tổng hợp 8 món ngon từ xà lách xoong dinh dưỡng dễ làm (mytour)", accessed_on: 2026-10-17}
notes: "Nước nấu canh (khoảng 1–1,5 lít cho 4 người) không ghi thành nguyên liệu."
