  uses_burner: false
- step_no: 2
  text_vi: Đun sôi khoảng 1,2 lít nước (hoặc xào sơ cua đồng, khoai sọ, rau rút), hớt bọt cho nước trong.
  kind: active
  minutes: 6
  uses_burner: true
- step_no: 3
  text_vi: Cho phần rau củ còn lại vào nấu chín tới, nêm gia vị vừa ăn và rắc rau thơm.
  kind: active
