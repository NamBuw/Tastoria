steps:
- step_no: 1
  text_vi: Rửa sạch, sơ chế cá diêu hồng, cà chua, dứa cùng giá đỗ và cắt miếng vừa ăn; băm nhỏ hành tỏi gia vị.
  kind: active
  minutes: 8
  uses_burner: false
- step_no: 2
  text_vi: Đun sôi khoảng 1,2 lít nước (hoặc xào sơ cá diêu hồng, cà chua, dứa), hớt bọt cho nước trong.
  kind: active
  minutes: 6
  uses_burner: true
- step_no: 3
  text_vi: Cho phần rau củ còn lại cùng giá đỗ vào nấu chín tới, nêm gia vị vừa ăn và rắc rau thơm.
  kind: active
  minutes: 6
  uses_burner: true
