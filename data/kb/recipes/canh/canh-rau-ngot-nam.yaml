slug: canh-rau-ngot-nam
name_vi: "Canh rau ngót nấu nấm"
slot: canh
servings: 4
method: nau_canh
tags: [thanh, nhieu_nuoc, bua_thuong, nau_nhanh]
ingredients:
  - {name: "rau ngót", grams: 300, role: main, note: "1 bó (≈ 300 g)"}
  - {name: "nấm rơm", grams: 200, role: main}
  - {name: "muối", grams: 3, role: seasoning, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 6 g)"}
  - {name: "hạt nêm chay", grams: 4, role: seasoning, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 4 g)"}
  - {name: "dầu ăn", grams: 4.7, role: seasoning, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 4.7 g)"}
steps:
  - {step_no: 1, text_vi: "Tuốt lá rau ngót, rửa sạch, vò nhẹ; gọt chân nấm, ngâm nước muối, rửa, bổ đôi.", kind: active, minutes: 10, uses_burner: false}
  - {step_no: 2, text_vi: "Đun sôi nước, cho rau củ vào, nêm muối và hạt nêm chay.", kind: active, minutes: 3, uses_burner: true}
  - {step_no: 3, text_vi: "Nấu lửa vừa đến khi rau củ chín.", kind: passive, minutes: 4, uses_burner: true}
  - {step_no: 4, text_vi: "Nêm lại, rắc hành lá hoặc rau thơm rồi tắt bếp.", kind: active, minutes: 1, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/2-cach-nau-canh-rau-ngot-muop-va-nam-thom-ngon-thanh-nhiet-10248", title: "2 Cách nấu canh rau ngót mướp và nấm thơm ngon thanh nhiệt", accessed_on: 2026-10-17}
  - {url: "https://hoanghamobile.com/tin-tuc/cach-nau-canh-rau-ngot/", title: "Cách nấu canh rau ngót (Hoàng Hà Mobile)", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/2-cach-nau-canh-rau-ngot-chay-dau-hu-thom-ngon-thanh-mat-don-11520", title: "2 cách nấu canh rau ngót chay đậu hũ thơm ngon thanh mát đơn giản", accessed_on: 2026-10-17}
notes: "Nước nấu canh (khoảng 1–1,5 lít cho 4 người) không ghi thành nguyên liệu."
