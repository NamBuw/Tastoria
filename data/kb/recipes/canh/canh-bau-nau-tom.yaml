slug: canh-bau-nau-tom
name_vi: "Canh bầu nấu tôm"
slot: canh
servings: 4
method: nau_canh
tags: [thanh, nhieu_nuoc, troi_nong, bua_thuong]
ingredients:
  - {name: "bầu", grams: 700, role: main, note: "1 quả (≈ 700 g)"}
  - {name: "tôm", grams: 200, role: main}
  - {name: "hành tím", grams: 20, role: seasoning, note: "2 củ (1 củ ≈ 10 g)"}
  - {name: "nước mắm", grams: 22.5, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: "dầu ăn", grams: 4.7, role: seasoning, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 4.7 g)"}
  - {name: "tiêu", grams: 0.6, role: seasoning, note: "1/4 muỗng cà phê (1 muỗng cà phê ≈ 2.3 g)"}
  - {name: "hành lá", grams: 30, role: seasoning, note: "2 cây (1 cây ≈ 15 g)"}
steps:
  - {step_no: 1, text_vi: "Gọt vỏ bầu, cắt miếng hoặc thái sợi; thái hành lá.", kind: active, minutes: 8, uses_burner: false}
  - {step_no: 2, text_vi: "Bóc vỏ, rút chỉ tôm, băm hoặc giã dập; ướp với hành tím băm, tiêu và một ít nước mắm.", kind: active, minutes: 6, uses_burner: false}
  - {step_no: 3, text_vi: "Phi hành, xào tôm đến khi đỏ và thơm, đổ nước vào đun sôi.", kind: active, minutes: 5, uses_burner: true}
  - {step_no: 4, text_vi: "Cho rau củ vào, nêm nước mắm.", kind: active, minutes: 2, uses_burner: true}
  - {step_no: 5, text_vi: "Nấu lửa vừa đến khi rau củ chín mềm.", kind: passive, minutes: 5, uses_burner: true}
  - {step_no: 6, text_vi: "Nêm lại, cho hành lá hoặc rau thơm rồi tắt bếp.", kind: active, minutes: 1, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-nau-canh-bau-nau-tom-tuoi-thom-mat-thanh-dam-cho-bua-com-13477", title: "Cách nấu canh bầu nấu tôm tươi thơm mát, thanh đạm cho bữa cơm", accessed_on: 2026-10-17}
  - {url: "https://vnexpress.net/canh-bau-nau-tom-dong-4737290.html", title: "Cách làm canh bầu nấu tôm đồng", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/3-cach-nau-canh-bau-tom-tuoi-ca-loc-va-suon-heo-mem-ngon-05849", title: "3 cách nấu canh bầu tôm tươi, cá lóc và sườn heo mềm ngon (Điện Máy XANH)", accessed_on: 2026-10-17}
notes: "Nước nấu canh (khoảng 1–1,5 lít cho 4 người) không ghi thành nguyên liệu."
