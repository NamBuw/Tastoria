slug: xa-lach-tron-dau-giam
name_vi: "Xà lách trộn dầu giấm"
slot: rau
servings: 4
method: tron
tags: [chua_ngot, gion, troi_nong, nau_nhanh]
ingredients:
  - {name: "xà lách", grams: 300, role: main, note: "2 cây (1 cây ≈ 150 g)"}
  - {name: "cà chua", grams: 120, role: main, note: "1 quả (1 quả ≈ 120 g)"}
  - {name: "hành tây", grams: 110, role: main, note: "1 củ (1 củ ≈ 110 g)"}
  - {name: "giấm", grams: 45, role: seasoning, note: "3 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: "đường", grams: 12, role: seasoning, note: "1 muỗng canh (1 muỗng canh ≈ 12 g)"}
  - {name: "muối", grams: 3, role: seasoning, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 6 g)"}
  - {name: "dầu ăn", grams: 28, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 14 g)"}
  - {name: "dưa chuột", grams: 150, role: side, optional: true, note: "1 quả (1 quả ≈ 150 g)"}
  - {name: "tiêu", grams: 0.6, role: seasoning, optional: true, note: "1/4 muỗng cà phê (1 muỗng cà phê ≈ 2.3 g)"}
steps:
  - {step_no: 1, text_vi: "Tách lá xà lách, ngâm nước muối loãng rồi rửa sạch, để thật ráo; cà chua và hành tây thái lát.", kind: active, minutes: 8, uses_burner: false}
  - {step_no: 2, text_vi: "Ngâm hành tây vào nước đá cho bớt hăng; pha giấm, đường, muối, dầu ăn và tiêu thành nước trộn.", kind: active, minutes: 3, uses_burner: false}
  - {step_no: 3, text_vi: "Trộn nhẹ rau với nước trộn ngay trước khi ăn.", kind: active, minutes: 2, uses_burner: false}
sources:
