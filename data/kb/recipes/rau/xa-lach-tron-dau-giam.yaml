  - {url: "https://vnexpress.net/xa-lach-tron-dau-giam-cholimex-4606350.html", title: "Xà lách trộn dầu giấm Cholimex - Báo VnExpress Cooking", accessed_on: 2026-10-17}
  - {url: "https://www.bachhoaxanh.com/kinh-nghiem-hay/huong-dan-lam-mon-salad-dau-giam-thom-ngon-bo-duong-de-lam-tai-nha-1373466", title: "Hướng dẫn làm món salad dầu giấm thơm ngon bổ dưỡng dễ làm tại nhà", accessed_on: 2026-10-17}
