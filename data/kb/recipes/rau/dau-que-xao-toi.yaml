slug: dau-que-xao-toi
name_vi: "Đậu que xào tỏi"
slot: rau
servings: 4
method: xao
tags: [thom_toi, gion, bua_thuong, com_hop, nau_nhanh]
ingredients:
  - {name: "đậu que", grams: 400, role: main}
  - {name: "tỏi", grams: 15, role: seasoning, note: "5 tép (1 tép ≈ 3 g)"}
  - {name: "muối", grams: 3, role: seasoning, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 6 g)"}
  - {name: "đường", grams: 2, role: seasoning, optional: true, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 4 g)"}
  - {name: "dầu ăn", grams: 21, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 14 g)"}
steps:
  - {step_no: 1, text_vi: "Tước xơ hai đầu đậu que, cắt khúc hoặc thái vát, rửa sạch.", kind: active, minutes: 8, uses_burner: false}
  - {step_no: 2, text_vi: "Chần đậu trong nước sôi có muối khoảng 2 phút, vớt ra để ráo.", kind: active, minutes: 4, uses_burner: true}
  - {step_no: 3, text_vi: "Phi thơm tỏi băm, cho đậu vào xào lửa lớn, nêm muối và đường.", kind: active, minutes: 4, uses_burner: true}
  - {step_no: 4, text_vi: "Đảo đều khi đậu chín và thấm thì tắt bếp.", kind: active, minutes: 1, uses_burner: true}
