slug: bo-xao-sup-lo
name_vi: "Bò xào súp lơ"
slot: rau
servings: 4
method: xao
tags: [dam_da, thom_toi, bua_thuong, com_hop]
ingredients:
  - {name: "súp lơ xanh", grams: 300, role: main}
  - {name: "súp lơ trắng", grams: 250, role: main}
  - {name: "thịt bò", grams: 200, role: main}
  - {name: "cà rốt", grams: 100, role: main, note: "1 củ (1 củ ≈ 100 g)"}
  - {name: "tỏi", grams: 15, role: seasoning, note: "5 tép (1 tép ≈ 3 g)"}
  - {name: "dầu hào", grams: 18, role: seasoning, note: "1 muỗng canh (1 muỗng canh ≈ 18 g)"}
  - {name: "nước mắm", grams: 7.5, role: seasoning, note: "1/2 muỗng canh (1 muỗng canh ≈ 15 g); ướp bò"}
  - {name: "tiêu", grams: 0.8, role: seasoning, note: "1/3 muỗng cà phê (1 muỗng cà phê ≈ 2.3 g)"}
  - {name: "bột năng", grams: 3.3, role: seasoning, optional: true, note: "1 muỗng cà phê (1 muỗng cà phê ≈ 3.3 g); pha nước tạo sánh"}
  - {name: "dầu ăn", grams: 28, role: seasoning, note: "2 muỗng canh (1 muỗng canh ≈ 14 g)"}
steps:
  - {step_no: 1, text_vi: "Thái thịt bò mỏng ngang thớ, ướp với nước mắm, tiêu, chút dầu ăn và tỏi băm.", kind: active, minutes: 7, uses_burner: false}
  - {step_no: 2, text_vi: "Cắt súp lơ thành bông nhỏ, cà rốt thái lát; rửa sạch.", kind: active, minutes: 7, uses_burner: false}
  - {step_no: 3, text_vi: "Chần súp lơ và cà rốt trong nước sôi khoảng 2 phút, vớt ra để ráo.", kind: active, minutes: 4, uses_burner: true}
  - {step_no: 4, text_vi: "Phi tỏi, xào bò lửa thật lớn đến khi vừa tái thì trút ra.", kind: active, minutes: 2, uses_burner: true}
  - {step_no: 5, text_vi: "Xào súp lơ và cà rốt với dầu hào, thêm chút nước bột năng, cho bò vào đảo nhanh rồi tắt bếp.", kind: active, minutes: 4, uses_burner: true}
sources:
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-lam-thit-bo-xao-sup-lo-xanh-bong-cai-xanh-thom-ngon-kho-15132", title: "Cách làm thịt bò xào súp lơ xanh - bông cải xanh thơm ngon tại nhà", accessed_on: 2026-10-17}
  - {url: "https://www.dienmayxanh.com/vao-bep/cach-lam-bo-xao-sup-lo-bong-cai-xanh-hap-dan-voi-chao-inox-22554", title: "Cách làm bò xào súp lơ (bông cải xanh) hấp dẫn với chảo inox (Điện Máy XANH)", accessed_on: 2026-10-17}
  - {url: "https://www.bachhoaxanh.com/kinh-nghiem-hay/bua-com-ngon-mieng-hon-voi-mon-thit-bo-xao-sup-lo-don-gian-1168077", title: "Bữa cơm ngon miệng hơn với món thịt bò xào súp lơ đơn giản", accessed_on: 2026-10-17}
notes: "Xào bò thật nhanh ở lửa lớn rồi trút ra trước để thịt không dai."
