slug: muop-xao-gia
name_vi: "Mướp xào giá"
slot: rau
servings: 4
method: xao
tags: [thanh, mem, bua_thuong, nau_nhanh]
ingredients:
  - {name: "mướp", grams: 600, role: main, note: "2 quả (1 quả ≈ 300 g)"}
  - {name: "giá đỗ", grams: 200, role: main}
  - {name: "tỏi", grams: 9, role: seasoning, note: "3 tép (1 tép ≈ 3 g)"}
  - {name: "hành lá", grams: 30, role: seasoning, optional: true, note: "2 cây (1 cây ≈ 15 g)"}
  - {name: "muối", grams: 3, role: seasoning, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 6 g)"}
  - {name: "dầu ăn", grams: 14, role: seasoning, note: "1 muỗng canh (1 muỗng canh ≈ 14 g)"}
steps:
  - {step_no: 1, text_vi: "Gọt vỏ mướp, cắt khúc rồi bổ miếng; nhặt rễ giá, rửa sạch; hành cắt khúc.", kind: active, minutes: 7, uses_burner: false}
  - {step_no: 2, text_vi: "Phi thơm tỏi, cho mướp vào xào lửa vừa đến khi mướp hơi mềm, nêm muối.", kind: active, minutes: 4, uses_burner: true}
  - {step_no: 3, text_vi: "Cho giá và hành lá vào đảo nhanh khoảng 1 phút rồi tắt bếp.", kind: active, minutes: 2, uses_burner: true}
sources:
