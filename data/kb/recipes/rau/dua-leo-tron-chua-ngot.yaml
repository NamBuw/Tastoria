slug: dua-leo-tron-chua-ngot
name_vi: "Dưa chuột trộn chua ngọt"
slot: rau
servings: 4
method: tron
tags: [chua_ngot, gion, troi_nong, bua_thuong, nau_nhanh]
ingredients:
  - {name: "dưa chuột", grams: 450, role: main, note: "3 quả (1 quả ≈ 150 g)"}
  - {name: "giấm", grams: 22.5, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 15 g)"}
  - {name: "đường", grams: 18, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 12 g)"}
  - {name: "tỏi", grams: 9, role: seasoning, note: "3 tép (1 tép ≈ 3 g)"}
  - {name: "ớt", grams: 5, role: seasoning, note: "1 quả (1 quả ≈ 5 g)"}
  - {name: "muối", grams: 3, role: seasoning, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 6 g)"}
  - {name: "rau mùi", grams: 10, role: seasoning, optional: true}
steps:
  - {step_no: 1, text_vi: "Rửa dưa chuột, đập dập hoặc thái lát, rắc chút muối cho dưa ra bớt nước rồi chắt bỏ.", kind: active, minutes: 5, uses_burner: false}
  - {step_no: 2, text_vi: "Pha giấm, đường, tỏi ớt băm thành nước trộn.", kind: active, minutes: 2, uses_burner: false}
  - {step_no: 3, text_vi: "Trộn dưa với nước trộn, để thấm khoảng 5 phút, thêm rau mùi khi dọn.", kind: active, minutes: 3, uses_burner: false}
sources:
  - {url: "https://fptshop.com.vn/tin-tuc/dien-may/nom-dua-chuot-162998", title: "Làm nộm dưa chuột chua ngọt, thanh mát thêm vào thực đơn giảm cân giữ dáng", accessed_on: 2026-10-17}
  - {url: "https://baohatinh.vn/dua-chuot-tron-chua-ngot-thanh-mat-cho-ngay-he-post133866.html", title: "Dưa chuột trộn chua ngọt thanh mát cho ngày hè", accessed_on: 2026-10-17}
  - {url: "https://www.24h.com.vn/am-thuc/tet-nay-lam-dua-chuot-tron-chua-ngot-an-chong-ngan-cuc-chuan-c460a1120020.html", title: "Tết này làm dưa chuột trộn chua ngọt, ăn chống ngán cực chuẩn", accessed_on: 2026-10-17}
notes: "Bản chay dùng giấm và muối; nhiều nhà thay một phần giấm bằng nước mắm."
