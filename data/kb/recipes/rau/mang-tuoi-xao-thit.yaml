  - {url: "https://www.bluestone.com.vn/blogs/vao-bep/mang-xao-thit-ba-chi", title: "Hướng dẫn 2 cách làm măng xào thịt ba chỉ đậm đà hương quê", accessed_on: 2026-10-17}
