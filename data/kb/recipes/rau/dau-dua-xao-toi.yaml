slug: dau-dua-xao-toi
name_vi: "Đậu đũa xào tỏi"
slot: rau
servings: 4
method: xao
tags: [thom_toi, gion, bua_thuong, com_hop, nau_nhanh]
ingredients:
  - {name: "đậu đũa", grams: 400, role: main, note: "khoảng 1,3 bó (1 bó ≈ 300 g)"}
  - {name: "tỏi", grams: 15, role: seasoning, note: "5 tép (1 tép ≈ 3 g)"}
  - {name: "muối", grams: 3, role: seasoning, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 6 g)"}
  - {name: "đường", grams: 2, role: seasoning, optional: true, note: "1/2 muỗng cà phê (1 muỗng cà phê ≈ 4 g)"}
  - {name: "dầu ăn", grams: 21, role: seasoning, note: "1,5 muỗng canh (1 muỗng canh ≈ 14 g)"}
steps:
  - {step_no: 1, text_vi: "Ngắt bỏ hai đầu đậu đũa, cắt khúc khoảng 4 cm, rửa sạch.", kind: active, minutes: 7, uses_burner: false}
  - {step_no: 2, text_vi: "Chần nhanh rau trong nước sôi có chút muối, vớt ra nước lạnh rồi để ráo.", kind: active, minutes: 3, uses_burner: true}
  - {step_no: 3, text_vi: "Đập dập và băm tỏi.", kind: active, minutes: 2, uses_burner: false}
  - {step_no: 4, text_vi: "Phi thơm một nửa tỏi với dầu, cho rau vào xào lửa lớn, nêm muối và đường.", kind: active, minutes: 4, uses_burner: true}
  - {step_no: 5, text_vi: "Cho nốt tỏi còn lại, đảo đều rồi tắt bếp.", kind: active, minutes: 1, uses_burner: true}
sources:
