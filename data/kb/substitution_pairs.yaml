# Bảng tra cặp thay thế nguyên liệu do nhóm soạn (catalog.substitution_pairs, curated = true; thiết kế v2 §6.3 (a)).
# Nạp: uv run --package tastoria-backend tastoria catalog substitutes import data/kb/substitution_pairs.yaml
# Kiểm: uv run --package tastoria-ml python -m tastoria_ml.kb.substitutes data/kb
#
# Trường:
#   ingredient / substitute  tên chuẩn trong ingredients.yaml (name_vi). Một dòng là một chiều: nguyên liệu bị thiếu
#                            -> đồ dùng thay. Hai chiều thì ghi hai dòng (điểm có thể khác nhau).
#   context_slot             man | rau | canh | null (null = mọi slot).
#   context_method           mã trong ref/cooking_methods.yaml | null (null = mọi cách nấu).
#   ratio                    gam đồ thay / gam đồ gốc (khối lượng lúc mua, BR-QTY-01); 1 trừ đồ khô <-> tươi.
#   score                    0–1, độ hợp của cặp trong ngữ cảnh đó: 0,85+ gần như không đổi món; 0,7–0,8 đổi vị/kết cấu
#                            nhẹ; 0,5–0,65 món vẫn ăn được nhưng khác rõ; < 0,5 chỉ là phương án cuối.
#   source                   URL đã đọc (kèm câu trích) hoặc 'kiến thức nấu ăn phổ biến: <lý do>'.
#
# Ràng buộc (validator tastoria_ml.kb.substitutes và lệnh import backend kiểm lại):
#   - cùng food_group: bộ lọc cứng lúc chạy (FR-17-05) bỏ mọi cặp khác nhóm, nên cặp khác nhóm là dữ liệu chết
#     (ví dụ hành lá rau_thom -> hành tây rau_cu_qua, me -> giấm gia_vi, cà chua -> me không ghi được);
#   - không tự thay chính nó; duy nhất theo (ingredient, substitute, context_slot, context_method); ratio > 0.
#   - đồ thay mang thêm nhóm dị ứng là được phép (lạc -> vừng): dị ứng lấy từ ingredients.yaml và bộ lọc
#     BR-ALG-01/BR-DIET-01 lúc chạy loại cặp đó với người dùng/người ăn cùng có nhóm dị ứng ấy.
