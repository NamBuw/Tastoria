# Nguyên liệu của kho món Tastoria (bảng catalog.ingredients + ingredient_synonyms + ingredient_allergens
# + ingredient_units, docs/sad/model.yaml). Tên tiếng Việt NFC, không trùng.
#
# Trường:
#   food_group       mã trong ref/food_groups.yaml.
#   comp_source      nguồn thành phần dinh dưỡng:
#                      source: fct2007 (mã trong data/processed/fct2007/foods.csv) — ưu tiên;
#                              usda (fdc_id trong data/processed/usda/foods.csv) — khi FCT không có mục hợp lý;
#                              null — kèm reason (không có mục phù hợp trong cả hai bảng).
#                    match: exact (cùng thực phẩm) | close (cùng loại, khác giống/cách gọi/phần) |
#                           proxy (thực phẩm khác dùng tạm, cần thay khi có nguồn tốt hơn).
#                    source_name chép tên trong bảng nguồn để người đọc soát nhanh (validator kiểm khớp).
#   is_staple        chỉ true cho gia vị luôn có trong bếp (BR-TRAY-04 miễn kiểm kho; BR-ALG-01 KHÔNG miễn
#                    kiểm dị ứng).
#   countable/units  đơn vị đếm (ref/units.yaml) và số gam mỗi đơn vị, gam = khối lượng lúc mua (BR-QTY-01).
#                    source: "usda_sr:<fdc_id> '<portion>'" khi lấy từ bảng khẩu phần USDA SR Legacy
#                    (food_portion.csv, thường là phần ăn được), "uoc_luong_nhom" là ước lượng của nhóm,
#                    chưa cân, cần cân lại khi soạn công thức.
#   allergens        mã trong ref/allergen_groups.yaml. allergen_note ghi phần phụ thuộc nhãn hãng.
#   synonyms         vi: cách gọi khác theo vùng; en: tên tiếng Anh kiểu danh sách nguyên liệu Food.com, để ánh xạ
#                    sang từ vựng Word2Vec (thiết kế v2 §6.3).
#   shelf_life       L trong BR-FRESH-01 (ngày, ngăn mát):
#                      basis foodkeeper: lấy fridge_max_days (cận trên) của mục FoodKeeper ghi trong foodkeeper_id
#                        (data/processed/foodkeeper/products.csv); validator kiểm days nằm trong [min, max];
#                      basis estimate: ước lượng của nhóm, có lý do, cần hiệu chỉnh bằng dữ liệu lô;
#                      basis not_tracked: đồ khô, gia vị, đồ để ngoài; days = null, không tính độ gấp.
