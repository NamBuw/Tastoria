# Nhóm thực phẩm của Tastoria (bảng catalog.food_groups, docs/sad/model.yaml).
# Dùng cho: mức ít/vừa/nhiều (qty_levels), loại trừ theo chế độ ăn (diet_exclusions),
# lọc cứng "cùng nhóm" khi gợi ý thay thế (thiết kế v2 §6.3).
# Nhóm do nhóm Tastoria tự đặt, tham khảo cách chia 14 nhóm của Bảng TPTP VN 2007 nhưng tách nhỏ
# hơn ở rau và thủy sản cho việc thay thế, và tách gia vị nguồn động vật (nước mắm, mắm tôm...)
# để chế độ ăn chay loại được chúng.
