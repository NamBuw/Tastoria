# Expanded 6 diets for M7 (code matches ^[a-z][a-z0-9_]*$ per kb/models.py & catalog/bundle.py).
version: 1
diets:
- code: chay
  name_vi: Ăn chay (không thịt, cá, hải sản, trứng; có sữa)
  excluded_food_groups:
  - thit
  - gia_cam
  - ca
  - hai_san
  - trung
  - gia_vi_dong_vat
- code: thuan_chay
  name_vi: Thuần chay (không sản phẩm động vật, kể cả sữa và trứng)
  excluded_food_groups:
  - thit
  - gia_cam
  - ca
  - hai_san
  - trung
  - sua
  - gia_vi_dong_vat
- code: giam_can
  name_vi: Giảm cân (loại đồ ăn vặt và dầu mỡ tách rời)
  excluded_food_groups:
  - do_an_vat
  - dau_mo
- code: tang_co
  name_vi: Tăng cơ (ưu tiên đạm thực phẩm, loại đồ ăn vặt ít dinh dưỡng)
  excluded_food_groups:
  - do_an_vat
- code: it_tinh_bot
  name_vi: Ít tinh bột (hạn chế ngũ cốc, khoai củ và đồ ăn vặt)
  excluded_food_groups:
  - ngu_coc
  - cu_khoai
  - do_an_vat
- code: than_thien_duong_huyet
  name_vi: Thân thiện đường huyết (hạn chế khoai củ chỉ số GI cao và đồ ngọt, đồ ăn vặt)
  excluded_food_groups:
  - do_an_vat
  - cu_khoai
