# Tastoria production-like stack (spec v2 §10). Only nginx publishes a port, on loopback:
# cloudflared on the host forwards the public domain to 127.0.0.1:6880.
#   cd deploy && ./scripts/deploy.sh
name: tastoria

x-backend: &backend
  image: tastoria-backend:${TASTORIA_IMAGE_TAG:-latest}
  env_file: .env
  environment:
    TASTORIA_ENV: production
    TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/tastoria
    TASTORIA_VALKEY_URL: redis://:${VALKEY_PASSWORD:?set in .env}@valkey:6379/0
    TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
    TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
  volumes:
    - files:/var/lib/tastoria/storage
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks: [backend]
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  nginx:
    image: tastoria-web:${TASTORIA_WEB_TAG:-${TASTORIA_IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:6880:8080"
    volumes:
      - files:/var/lib/tastoria/storage:ro
      # APK downloads under /tai-ve/ (repo dist/, gitignored)
      - ../dist:/srv/tastoria/dist:ro
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [backend]
    logging: *logging

  api:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      TASTORIA_ENV: production
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria_app:${POSTGRES_APP_PASSWORD:?set in .env}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://:${VALKEY_PASSWORD:?set in .env}@valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
      TASTORIA_MEAL_CALORIE_MODEL_DIR: /app/models/meal_calorie
      TASTORIA_DISH_CLASSIFIER_MODEL_DIR: /app/models/dish_classifier
      TASTORIA_KB_DIR: /app/data/kb
      TASTORIA_KB_PROCESSED_DIR: /app/data/processed/kb
      TASTORIA_PRELOAD_MEAL_CALORIE: "true"
    cpus: 2
    mem_limit: 4g
    stop_grace_period: 30s
    volumes:
      - files:/var/lib/tastoria/storage
      - ./models/meal_calorie:/app/models/meal_calorie:ro
      - ./models/dish_classifier:/app/models/dish_classifier:ro
      - ./models/plate_detector:/app/models/plate_detector:ro
    command:
      - uvicorn
      - tastoria.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --workers=${TASTORIA_API_WORKERS:-2}
      - --proxy-headers
      # only nginx (same private network) can reach the api; it sets X-Forwarded-For to the real client
      - --forwarded-allow-ips=*
      - --timeout-graceful-shutdown=20
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s

  migrate:
    <<: *backend
    environment:
      TASTORIA_ENV: production
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://:${VALKEY_PASSWORD:?set in .env}@valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
    command:
      - sh
      - -ec
      - |
        tastoria db upgrade
        tastoria catalog import data/kb
        tastoria catalog substitutes import data/kb/substitution_pairs.yaml
        sh /app/models-bootstrap.sh
    volumes:
      - files:/var/lib/tastoria/storage
      # model files staged by scripts/deploy.sh (ml/runs/… is gitignored, so they are not in the image)
      - ./models:/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Scan inference (spec v2 §8): RQ SimpleWorker on queue `scan`, loads the deployed detector once (sha256 checked,
  # onnxruntime 2 intra-op threads). Limits = the NFR-PERF-01 measurement condition (--cpus=2 --memory=4g).
  # Photos and model artifacts are read from the file volume, mounted read-only.
  worker:
    <<: *backend
    environment:
      TASTORIA_ENV: production
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria_app:${POSTGRES_APP_PASSWORD:?set in .env}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://:${VALKEY_PASSWORD:?set in .env}@valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
      TASTORIA_MUSHROOM_CLASSIFIER_MODEL_DIR: /app/models/mushroom_classifier
    command: ["tastoria", "worker"]
    volumes:
      - files:/var/lib/tastoria/storage:ro
      - ./models/mushroom_classifier:/app/models/mushroom_classifier:ro
    cpus: 2
    mem_limit: 4g
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "tastoria", "worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # scheduler = the cron container of ADR 0003, as a plain loop (no cron daemon in a non-root image).
  scheduler:
    <<: *backend
    environment:
      TASTORIA_ENV: production
      TASTORIA_DATABASE_URL: postgresql+psycopg://tastoria_jobs:${POSTGRES_JOBS_PASSWORD:?set in .env}@postgres:5432/tastoria
      TASTORIA_VALKEY_URL: redis://:${VALKEY_PASSWORD:?set in .env}@valkey:6379/0
      TASTORIA_STORAGE_DIR: /var/lib/tastoria/storage
      TASTORIA_ACCEL_REDIRECT_PREFIX: /_protected/
    command: ["sh", "/app/scheduler.sh"]
    cpus: 1
    mem_limit: 1g
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/scheduler.beat 2>/dev/null || echo 0) )) -lt 300"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: tastoria
      POSTGRES_DB: tastoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=lz4
      - -c
      - log_min_duration_statement=1000
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - pgdata:/var/lib/postgresql
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastoria -d tastoria"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [backend]
    logging: *logging

  valkey:
    image: valkey/valkey:9
    environment:
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set in .env}
    # AOF + RDB persistence, password-protected, noeviction so rate-limit/lockout keys and RQ state stay safe.
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?set in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "300"
      - "1"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkeydata:/data
    cpus: 1
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]
    logging: *logging

volumes:
  pgdata:
    name: tastoria_pgdata
  files:
    name: tastoria_files
  valkeydata:
    name: tastoria_valkeydata

networks:
  backend:
    name: tastoria_backend
