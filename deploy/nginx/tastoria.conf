# Docker's DNS; `resolve` re-resolves api when its container is recreated (new IP) without restarting nginx,
# and lets nginx start while api is down (nginx >= 1.27.3).
resolver 127.0.0.11 valid=30s ipv6=off;

upstream tastoria_api {
    zone tastoria_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 8080 default_server;
    # Cloudflare chuyển tiếp X-Forwarded-Proto của trình duyệt: http → chuyển sang https (pinned host)
    if ($http_x_forwarded_proto = "http") { return 301 https://tastoria.ctslab.net$request_uri; }
    server_name tastoria.ctslab.net localhost 127.0.0.1;

    root /usr/share/nginx/tastoria;

    # Scans: <= 2 images x 3 MB (spec v2 §8) + multipart overhead.
    client_max_body_size 8m;
    limit_conn conn_per_ip 60;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # ---------------------------------------------------------------- API
    location ^~ /api/v1/auth/ {
        limit_req zone=api_auth burst=30 nodelay;
        proxy_pass http://tastoria_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        add_header Cache-Control $api_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location /api/ {
        limit_req zone=api_general burst=120 nodelay;
        proxy_pass http://tastoria_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        # Cloudflare terminates TLS in prod (https); local loopback E2E requests keep $scheme (http).
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # long-poll GET /scans/{id}?wait=10 and catalog-heavy plans
        proxy_read_timeout 60s;
        proxy_buffering on;
        # API answers are per user: never let Cloudflare or a browser cache them unless the API says so.
        add_header Cache-Control $api_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location = /healthz {
        proxy_pass http://tastoria_api;
        proxy_set_header Host $http_host;
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://tastoria_api;
        proxy_set_header Host $http_host;
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location = /metrics {
        if ($http_cf_connecting_ip != "") { return 403; }
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://tastoria_api;
        proxy_set_header Host $http_host;
        proxy_set_header CF-Connecting-IP "";
        access_log off;
    }

    # Files: the API checks ownership, then answers X-Accel-Redirect: /_protected/<key> (ADR 0002,
    # TASTORIA_ACCEL_REDIRECT_PREFIX). Not reachable from outside.
    location /_protected/ {
        internal;
        alias /var/lib/tastoria/storage/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # ---------------------------------------------------------------- web app (Expo export, web.output single)
    # Content-hashed bundles and assets: cache for a year.
    location ^~ /_expo/ {
        error_page 404 /gioi-thieu/404.html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location ^~ /assets/ {
        error_page 404 /gioi-thieu/404.html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.openfoodfacts.org https://*.openfoodfacts.net; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # ---------------------------------------------------------------- landing + APK
    # add_header inside a location drops the server-level ones, so each location repeats them.

    location = / {
        rewrite ^ /gioi-thieu/index.html last;
    }

    location = /gioi-thieu {
        # relative Location: behind Cloudflare (TLS ends there) an absolute one would say http:// and this port
        absolute_redirect off;
        return 301 /gioi-thieu/;
    }

    location ^~ /gioi-thieu/ {
        alias /usr/share/nginx/landing/;
        error_page 404 /gioi-thieu/404.html;

        # Fonts and screenshots: names are not content-hashed, so one week, not immutable.
        location ~ ^/gioi-thieu/((?:fonts|img)/[A-Za-z0-9._-]+)$ {
            alias /usr/share/nginx/landing/$1;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location = /gioi-thieu/style.css {
            alias /usr/share/nginx/landing/style.css;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location = /gioi-thieu/story.js {
            alias /usr/share/nginx/landing/story.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location = /gioi-thieu/ {
            rewrite ^ /gioi-thieu/index.html last;
        }

        location = /gioi-thieu/index.html {
            internal;
            alias /usr/share/nginx/landing/index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location = /gioi-thieu/rieng-tu.html {
            alias /usr/share/nginx/landing/rieng-tu.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location = /gioi-thieu/dieu-khoan.html {
            alias /usr/share/nginx/landing/dieu-khoan.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location = /gioi-thieu/404.html {
            internal;
            alias /usr/share/nginx/landing/404.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # anything else under /gioi-thieu/ (docs/, unknown paths) is not published
        return 404;
    }

    # Only APK files are served from dist/ (dist/ also holds tastoria-vp-kit.zip, which stays private).
    location ~ ^/tai-ve/(tastoria-[0-9][0-9A-Za-z.-]*\.apk)$ {
        error_page 404 /gioi-thieu/404.html;
        alias /srv/tastoria/dist/$1;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # plain prefix (no ^~), so the regex above is tried first
    location /tai-ve/ {
        error_page 404 /gioi-thieu/404.html;
        return 404;
    }

    location = /etc/passwd { return 404; }
    location ~* \.php$ { return 404; }

    # Anything else is a SPA client route (/kho, /mam, /dat-lai-mat-khau?token=...) and gets index.html (no-cache).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.openfoodfacts.org https://*.openfoodfacts.net; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
