# Docker's DNS; `resolve` re-resolves api when its container is recreated (new IP) without restarting nginx,
# and lets nginx start while api is down (nginx >= 1.27.3).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream tastoria_api {
    zone tastoria_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/tastoria;

    # Scans: <= 2 images x 3 MB (spec v2 §8) + multipart overhead.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://tastoria_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Cloudflare terminates TLS; the public scheme is always https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # long-poll GET /scans/{id}?wait=10 and catalog-heavy plans
        proxy_read_timeout 60s;
        proxy_buffering on;
        # API answers are per user: never let Cloudflare or a browser cache them unless the API says so.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        proxy_pass http://tastoria_api;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://tastoria_api;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Files: the API checks ownership, then answers X-Accel-Redirect: /_protected/<key> (ADR 0002,
    # TASTORIA_ACCEL_REDIRECT_PREFIX). Not reachable from outside.
    location /_protected/ {
        internal;
        alias /var/lib/tastoria/storage/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------------------------------------------- web app (Expo export, web.output single)
    # Content-hashed bundles and assets: cache for a year.
    location ^~ /_expo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Unhashed files at the root (favicon.ico, metadata.json): short cache. Anything else is a client route
    # (/kho, /mam, /dat-lai-mat-khau?token=...) and gets index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
