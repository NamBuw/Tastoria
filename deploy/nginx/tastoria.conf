# Docker's DNS; `resolve` re-resolves api when its container is recreated (new IP) without restarting nginx,
# and lets nginx start while api is down (nginx >= 1.27.3).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream tastoria_api {
    zone tastoria_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    # Cloudflare chuyển tiếp X-Forwarded-Proto của trình duyệt: http → chuyển sang https
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    server_name _;

    root /usr/share/nginx/tastoria;

    # Scans: <= 2 images x 3 MB (spec v2 §8) + multipart overhead.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://tastoria_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Cloudflare terminates TLS; the public scheme is always https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # long-poll GET /scans/{id}?wait=10 and catalog-heavy plans
        proxy_read_timeout 60s;
        proxy_buffering on;
        # API answers are per user: never let Cloudflare or a browser cache them unless the API says so.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        proxy_pass http://tastoria_api;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://tastoria_api;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Files: the API checks ownership, then answers X-Accel-Redirect: /_protected/<key> (ADR 0002,
    # TASTORIA_ACCEL_REDIRECT_PREFIX). Not reachable from outside.
    location /_protected/ {
        internal;
        alias /var/lib/tastoria/storage/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------------------------------------------- web app (Expo export, web.output single)
    # Content-hashed bundles and assets: cache for a year.
    location ^~ /_expo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # ---------------------------------------------------------------- landing + APK (landing/nginx-snippet.conf)
    # Tastoria landing (/gioi-thieu/) and APK download (/tai-ve/), for the `server` block of deploy/nginx/tastoria.conf,
    # placed before `location /` (the app starts at `/bep`).
    #
    # Expected files inside the nginx container:
    #   /usr/share/nginx/landing/   landing/index.html, style.css, fonts/, img/   (baked in web.Dockerfile)
    #   /srv/tastoria/dist/         repo dist/ mounted read-only (APK files)
    #
    # add_header inside a location drops the server-level ones, so each location repeats them (same as tastoria.conf).

    location = / {
        rewrite ^ /gioi-thieu/index.html last;
    }

    location = /gioi-thieu {
        # relative Location: behind Cloudflare (TLS ends there) an absolute one would say http:// and this port
        absolute_redirect off;
        return 301 /gioi-thieu/;
    }

    location ^~ /gioi-thieu/ {
        alias /usr/share/nginx/landing/;

        # Fonts and screenshots: names are not content-hashed, so one week, not immutable.
        location ~ ^/gioi-thieu/((?:fonts|img|vendor)/[A-Za-z0-9._-]+)$ {
            alias /usr/share/nginx/landing/$1;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /gioi-thieu/style.css {
            alias /usr/share/nginx/landing/style.css;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /gioi-thieu/food-scene.js {
            alias /usr/share/nginx/landing/food-scene.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /gioi-thieu/story.js {
            alias /usr/share/nginx/landing/story.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /gioi-thieu/ {
            rewrite ^ /gioi-thieu/index.html last;
        }

        location = /gioi-thieu/index.html {
            internal;
            alias /usr/share/nginx/landing/index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }

        # anything else under /gioi-thieu/ (docs/, this snippet, unknown paths) is not published
        return 404;
    }

    # Only APK files are served from dist/ (dist/ also holds tastoria-vp-kit.zip, which stays private).
    location ~ ^/tai-ve/(tastoria-[0-9][0-9A-Za-z.-]*\.apk)$ {
        alias /srv/tastoria/dist/$1;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # plain prefix (no ^~), so the regex above is tried first
    location /tai-ve/ {
        return 404;
    }

    # Unhashed files at the root (favicon.ico, metadata.json): short cache. Anything else is a client route
    # (/kho, /mam, /dat-lai-mat-khau?token=...) and gets index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
