worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { font/ttf ttf; }

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Cloudflare Tunnel (cloudflared on the host) -> 127.0.0.1:6880 -> this container via the Docker bridge.
    # Trust CF-Connecting-IP only from the bridge / loopback, so the API's login lock (per email + IP,
    # NFR-SEC-02) counts the real client and not the tunnel.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
        '"upstream_rt":"$upstream_response_time","request_id":"$upstream_http_x_request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/problem+json
               image/svg+xml font/ttf;

    include /etc/nginx/conf.d/*.conf;
}
