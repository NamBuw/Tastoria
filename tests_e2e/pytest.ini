[pytest]
pythonpath = .
testpaths = .
addopts = -v --strict-markers --tb=short
markers =
    tier1: Tier 1 isolated happy-path feature coverage tests
    tier2: Tier 2 boundary, corner-case, and negative/error-handling tests
    tier3: Tier 3 pairwise cross-feature integration combination tests
    tier4: Tier 4 real-world Vietnamese household end-to-end journey tests
    browser: Playwright Chromium browser automation tests
